# =============================================================================
# pixel_tune profile: game  (games / Pokémon GO)
# Pixel 8a / Tensor G3 "zuma" — values derived EXCLUSIVELY from SPEC.md
# =============================================================================
#
# INTENT: games. Combines with Android Game Mode (`cmd game ...`), which
# handles downscale and the FPS cap separately — this profile DOES NOT get
# involved in resolution or FPS (and per the HARD CONSTRAINTS in the SPEC, the
# global refresh rate is never lowered).
#
# THE STRATEGY DICTATED BY THE MEASURED DATA:
#  Under sustained load the system cuts itself down to Big 910 MHz (38 % of
#  HW) and Prime 1164 MHz (40 % of HW), and it does so already at 58 °C
#  junction / 40.5 °C skin (SPEC).
#  In other words: for a game running for tens of minutes, peak performance
#  DOES NOT MATTER — what matters is how high the steady level is and whether
#  the render thread can spin up in time between frames. So this profile does
#  three things:
#   1) gives top-app a floor (frame-time stability, not a higher ceiling),
#   2) tidies up the background so it does not steal Big/Prime and add heat,
#   3) tries to relax CPU throttling via the `game` thermal profile —
#      UNVERIFIED.
#  The GPU is deliberately left at stock.
# =============================================================================

PROFILE_NAME="game"
PROFILE_DESC="Games — stable frame-time, tidy background, GPU unchanged"

# --- uclamp ------------------------------------------------------------------

# 30 => util 307 (the 0-100 scale is relative to the Prime capacity of 1024).
# Given the measured cpu_capacity values (Little 182 / Big 725 / Prime 1024):
#   - 307 > 182 => the render thread does not fit on Little => the scheduler
#     keeps it on the Big cluster. That is the placement a game wants.
#   - on Big that is a floor of ~1002 MHz (307/725 x 2367) => between frames
#     the thread does not fall to a low OPP and the next frame does not start
#     from zero.
#   - 30 << 70.8 => the floor by itself does NOT FORCE a Prime (X3) wakeup.
#     The game can still get it (the cap is stock "max"), but it does not get
#     it for free and permanently.
# Higher than in `performance` (25 => ~836 MHz), because the load is sustained
# and predictable, not a short interactive spike.
# I deliberately DO NOT go to 38-40+: that would already push against the
# throttling loop, and given the measured recovery (MaxReleaseStep=1 => ~84 s,
# with NOTHING released in the first 60 s after the load) it would end with a
# permanently throttled phone in the middle of a game.
UCLAMP_TOPAPP_MIN="30"

# The top-app cap stays at stock ("max") — a game should have everything the
# HAL is willing to leave it.
UCLAMP_TOPAPP_MAX=""

# background: UCLAMP_BG_MAX (via /dev/cpuctl/background) is a NO-OP and was
# therefore DELETED. The vendor /proc/vendor_sched/groups/bg/uclamp_max ships
# at 130 (12.7 %), which is ALREADY below the Little threshold
# (182/1024 = 17.8 %). uclamp from /dev/cpuctl and from the vendor interface
# are aggregated and the STRICTER of the two applies => anything >130 (the
# former 30 => 307) written into cpuctl/background has no effect. Google keeps
# the background off the big cores by itself.

# system-background: 40 => util 410 => ~1338 MHz on Big; Prime excluded.
# 40 % is exactly the level the system measurably holds under sustained load
# (Prime 1164 MHz = 40 %). I take nothing from system services that the HAL
# would not give them under the same load anyway, but I keep them out of the
# thermal peak.
UCLAMP_SYSBG_MAX="40"

# foreground DELIBERATELY UNTOUCHED: I have no measurement of which game
# processes (audio, IAP, game services, engine-side processes) actually land
# in the `foreground` group rather than `top-app` on this device. A blanket
# cap there could cause audio glitches or micro-stutters. Conservatively
# empty.
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""

# Floors for the background make no sense in any profile.
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# --- GPU ---------------------------------------------------------------------
# DELIBERATELY UNCHANGED. Games are GPU-bound; stock scaling_max_freq = 890000
# is already the highest step, so there is nowhere up, and capping the GPU in
# a GAME profile is counterproductive. GPU throttling is handled by
# cooling_device24 via the thermal HAL.
# I could raise scaling_min_freq for frame-time stability, BUT the SPEC
# contains NO GPU measurements at all (utilisation, G3D temperature under
# load, ramp time), so it would be guesswork with a direct effect on
# temperature. Not set.
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profile -----------------------------------------------------
# !!! AWAITING VERIFICATION !!!
# SPEC: `game` profiles exist for VIRTUAL-SKIN-CPU-MID and
# VIRTUAL-SKIN-CPU-HIGH, and in the `game` profile their CPU cdev bindings
# have "Disabled": true => LESS CPU throttling.
# The SPEC also states, however, that it is NOT verified that this actually
# works.
# It is the only lever that could move the measured steady ceiling (Big 38 %,
# Prime 40 % at a mere 58 °C junction / 40.5 °C skin — i.e. throttling that is
# clearly very conservative), which is why it belongs here — but only here,
# only temporarily, and with this warning.
# VERIFICATION: after ~150 s of load, compare scaling_cur_freq on
# policy4/policy8 against the measured 910000 / 1164000. If nothing changes,
# the mechanism does not work and both values below should be emptied.
# CAUTION (an implementation duty, not a profile one): the system sets this
# prop itself — during the probe it was already on "camera". Application code
# MUST NOT overwrite the prop while the camera is running, and must restore it
# to "" (default) when leaving the profile.
THERMAL_PROFILE_CPU_MID="game"
THERMAL_PROFILE_CPU_HIGH="game"

# --- vm ----------------------------------------------------------------------
# HANDS OFF. It would be tempting to lower swappiness "so the game does not
# get swapped out", except the SPEC measures that zram runs on the Emerald
# Hill hardware accelerator (`lz77eh`) and compression costs ~0 CPU and ~0
# heat => swap is not expensive here. The SPEC contains no swap-in latency
# measurement, so any value would be guesswork. page-cluster=0 is already
# optimal per the SPEC. Per the brief, zram is not touched at all.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# The SPEC lists neither a stock readahead nor any I/O measurement. For games
# (PoGO = network + small random reads) I would have no basis anyway. Not set.
IO_READAHEAD_KB=""

# --- charging ----------------------------------------------------------------
# Gaming while charging is the worst possible thermal combination, BUT a
# charge cap does nothing for temperature while gaming on battery and would
# change the user's available capacity mid-game. Not set; `pxtune charge` is
# there for limiting charge.
CHARGE_STOP_LEVEL=""

# =============================================================================
# CONTRACT v2 — new levers (empty = do not touch). Stock values in the
# comments are REAL, verified by the probe on 2026-08-07. game exploits
# thermal inertia for a SHORT demanding session — but with a hard thermal
# safety net (see THERMAL_PROFILE_MAX_SKIN).
# =============================================================================

# --- vendor_sched (/proc/vendor_sched, scale 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min       stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min       stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max       stock 130
VS_TA_PREFER_IDLE=""        # groups/ta/prefer_idle      stock false
VS_DVFS_HEADROOM=""         # dvfs_headroom              stock 1100

# --- sched_pixel governor ---
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency    stock 1328000
SCHED_LIMIT_FREQ_MID=""     # policy4 limit_frequency    stock 1836000
SCHED_LIMIT_FREQ_BIG=""     # policy8 limit_frequency    stock 2363000
# CHANGE 2026-08-08: 20000 -> 3000 on both clusters.
#
# The original 20000 (20 ms) was meant to hold the clock up between taps. The
# problem: the frame period is 8.3 ms (120 Hz) to 16.6 ms (60 Hz), so 20 ms is
# LONGER THAN A WHOLE FRAME — the governor then practically never lets the
# clock down at all. In a profile that additionally disables 2 of the 4 skin
# sensors via THERMAL_PROFILE_*="game", that is the most expensive possible
# combination: the heat has nowhere to go, and with the measured recovery
# (MaxReleaseStep=1 => ~84 s) you pay for it for a long time.
#
# 3000 (3 ms) holds the clock across the gap between touches but fits inside
# the frame budget, so the clock can still fall in the troughs of the load.
# The same value as `performance` and `balanced` after the v2.1 revision.
#
# If measurements later show that frame-time is measurably more stable with
# 20000 and that the skin can take it, it is a value that can be restored —
# but with data, not in advance.
SCHED_DOWN_RATE_MID="3000"  # policy4 down_rate_limit_us  stock 500  (probe; NOT 20000)
SCHED_DOWN_RATE_BIG="3000"  # policy8 down_rate_limit_us  stock 500  (probe; NOT 20000)

# --- devfreq ---
DEVFREQ_MIF_TARGET_LOAD=""  # mif interactive/target_load stock "20 40" (probe)
DEVFREQ_DSU_MIN=""          # dsu min_freq               stock 324000 (probe)
DEVFREQ_MIF_MIN=""          # mif min_freq               stock 421000 (probe)

# --- idle residency ---
# DELIBERATELY EMPTY. The research proposed CPUPM_CL2_RESIDENCY=750000 (so the
# cluster does not power down between frames), BUT the probe showed the REAL
# stock is 10000 (10 ms). Writing 750000 would power the cluster down MUCH
# LATER than it does out of the box — not what we want.
CPUPM_CL1_RESIDENCY=""      # cpd_cl1_target_residency   REAL stock 10000 (probe; NOT 750000)
CPUPM_CL2_RESIDENCY=""      # cpd_cl2_target_residency   REAL stock 10000 (probe; NOT 750000)

# --- GPU ---
# 10 ms = snappier GPU frequency re-evaluation (what the power HAL uses on
# LAUNCH) => faster GPU reaction to a load spike in a game. Stock 20.
GPU_DVFS_PERIOD="10"        # mali dvfs_period  10|20 ms  stock 20 (probe)

# --- memory ---
# 1000 ms of working-set protection. In a game this shows more than in any
# other profile: a game has a large working set, and when you switch away for
# a moment (a message, the browser), the pages evicted to zram in the meantime
# get pulled back on return — that is the long stall after alt-tabbing.
# Stock 0 = no protection.
#
# I deliberately do NOT go above 1000 (the kernel recommendation): a game has
# a large RSS and longer protection raises the chance that something else dies
# when memory runs short. If apps start disappearing from your recents list,
# that is what is happening and the value should come down.
MEM_LRU_MIN_TTL="1000"      # /sys/kernel/mm/lru_gen/min_ttl_ms  stock 0 (probe)

# --- thermal, STRICTLY GUARDED ---
THERMAL_CDEV_BYPASS=""      # 0|1 — runtime skin-throttling kill switch; does NOT belong in game (the game prop is enough)
# 41 °C = A HARD SAFETY NET. THERMAL_PROFILE_CPU_{MID,HIGH}="game" above
# disables 2 of the 4 skin sensors => the phone really does get hotter. Above
# 41 °C skin the game prop is NOT deployed, and if the limit is crossed while
# running it MUST be removed. bin/pxtune does the implementation, the profile
# only declares the limit (41 = the first VIRTUAL-SKIN-CPU-MID threshold).
THERMAL_PROFILE_MAX_SKIN="41"
