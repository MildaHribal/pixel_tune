# =============================================================================
# pixel_tune profil: game  (hry / Pokémon GO)
# Pixel 8a / Tensor G3 "zuma" — hodnoty odvozené VÝHRADNĚ ze SPEC.md
# =============================================================================
#
# ZÁMĚR: hry. Kombinuje se s Android Game Mode (`cmd game ...`), který řeší
# downscale a FPS cap zvlášť — tenhle profil se do rozlišení ani do FPS NEPLETE
# (a globální refresh rate se dle TVRDÝCH OMEZENÍ ve SPEC nesnižuje).
#
# STRATEGIE, kterou diktují naměřená data:
#  Pod trvalou zátěží se systém sám sráží na Big 910 MHz (38 % HW) a Prime
#  1164 MHz (40 % HW), a to už při junction 58 °C / skin 40,5 °C (SPEC).
#  Tedy: u hry, která běží desítky minut, NEROZHODUJE špičkový výkon —
#  rozhoduje, jak vysoko je ustálená hladina a jestli render thread stíhá
#  včas naskočit mezi snímky. Proto tenhle profil dělá tři věci:
#   1) dá top-app podlahu (stabilita frame-time, ne vyšší strop),
#   2) uklidí pozadí, aby nekradlo Big/Prime a nepřidávalo teplo,
#   3) zkusí uvolnit CPU škrcení přes thermal profil `game` — NEOVĚŘENO.
#  GPU záměrně nechává na stocku.
# =============================================================================

PROFILE_NAME="game"
PROFILE_DESC="Hry — stabilní frame-time, uklizené pozadí, GPU beze změny"

# --- uclamp ------------------------------------------------------------------

# 30 => util 307 (škála 0-100 je relativní k capacity Prime = 1024).
# Podle naměřených cpu_capacity (Little 182 / Big 725 / Prime 1024):
#   - 307 > 182 => render vlákno se nevejde do Little => scheduler ho drží
#     na Big cluster. To je pro hru žádoucí umístění.
#   - na Big to je podlaha ~1002 MHz (307/725 x 2367) => vlákno mezi snímky
#     nespadne na nízké OPP a další snímek nezačíná z nuly.
#   - 30 << 70,8 => podlaha sama NEVYNUTÍ probuzení Prime (X3). Hra ho pořád
#     dostat může (strop je stock "max"), ale nedostane ho zadarmo a natrvalo.
# Vyšší než u `performance` (25 => ~836 MHz), protože zátěž je trvalá
# a předvídatelná, ne krátká interaktivní špička.
# Vědomě NEJDU na 38-40+: to už by tlačilo proti škrticí smyčce a vzhledem
# k naměřenému zotavení (MaxReleaseStep=1 => ~84 s, 60 s po zátěži se NIC
# neuvolnilo) by to skončilo trvale zaškrceným telefonem uprostřed hry.
UCLAMP_TOPAPP_MIN="30"

# Strop top-app zůstává stock ("max") — hra má mít k dispozici všechno,
# co jí HAL nechá.
UCLAMP_TOPAPP_MAX=""

# background: 30 => util 307 => ~1002 MHz na Big.
# UPŘESNĚNÍ podle naměřených capacity (Little 182 / Big 725 / Prime 1024):
# 30 je NAD prahem 17,8, takže pozadí na Big stále SMÍ — jen na nízké
# frekvenci. Zaručeně vyloučen je pouze Prime (30 < 70,8). Během hry je to
# hlavní zisk: nejdražší jádro nepálí na background úlohy a nepřidává teplo.
# Striktní varianta (<=17 = pozadí jen na Little) by dál snížila soupeření
# s render threadem o Big, ale nemám měření, že to nezpůsobí zadrhávání
# herních pomocných procesů => volím konzervativnějších 30.
UCLAMP_BG_MAX="30"

# system-background: 40 => util 410 => ~1338 MHz na Big; Prime vyloučen.
# 40 % je přesně úroveň, kterou si systém sám naměřeně drží pod trvalou
# zátěží (Prime 1164 MHz = 40 %). Neberu systémovým službám nic, co by jim
# HAL pod stejnou zátěží stejně nedal, ale zabraňuji jim v teplotní špičce.
UCLAMP_SYSBG_MAX="40"

# foreground ZÁMĚRNĚ NESAHÁM: nemám měření, které procesy hry (audio, IAP,
# herní služby, engine-side procesy) na tomhle zařízení skutečně padnou do
# skupiny `foreground` místo `top-app`. Paušální strop tam by mohl způsobit
# trhání zvuku nebo mikro-seky. Konzervativně prázdné.
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""

# Podlahy pro pozadí nedávají smysl v žádném profilu.
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# --- GPU ---------------------------------------------------------------------
# ZÁMĚRNĚ BEZE ZMĚNY. Hry jsou GPU-bound; stock scaling_max_freq = 890000 už je
# nejvyšší krok, takže nahoru není kam, a stropovat GPU ve HERNÍM profilu je
# protismyslné. GPU throttling řeší cooling_device24 přes thermal HAL.
# scaling_min_freq bych mohl zvednout kvůli stabilitě frame-time, ALE SPEC
# neobsahuje ŽÁDNÉ měření GPU (utilizace, teplota G3D pod zátěží, čas náběhu),
# takže by šlo o hádání s přímým dopadem na teplotu. Nenastavuji.
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# !!! ČEKÁ NA OVĚŘENÍ !!!
# SPEC: profily `game` existují pro VIRTUAL-SKIN-CPU-MID a VIRTUAL-SKIN-CPU-HIGH
# a v profilu `game` mají CPU cdev vazby "Disabled": true => MÉNĚ CPU throttlingu.
# SPEC ale zároveň uvádí, že NENÍ ověřeno, že to reálně funguje.
# Je to jediná páka, která může posunout naměřený ustálený strop (Big 38 %,
# Prime 40 % při pouhých 58 °C junction / 40,5 °C skin — tedy škrcení, které
# je zjevně hodně konzervativní), proto sem patří — ale jen sem, jen dočasně
# a s tímhle varováním.
# OVĚŘENÍ: po ~150 s zátěže porovnat scaling_cur_freq policy4/policy8 proti
# naměřeným 910000 / 1164000. Když se nezmění, tenhle mechanismus nefunguje
# a obě hodnoty níž se mají vyprázdnit.
# POZOR (povinnost implementace, ne profilu): systém si tento prop nastavuje
# sám — při probu byl už na "camera". Aplikační kód NESMÍ prop přepsat, když
# běží kamera, a při odchodu z profilu ho musí vrátit na "" (default).
THERMAL_PROFILE_CPU_MID="game"
THERMAL_PROFILE_CPU_HIGH="game"

# --- vm ----------------------------------------------------------------------
# NESAHÁM. Lákalo by snížit swappiness "aby se hra neodswapovala", jenže SPEC
# měří, že zram jede na HW akcelerátoru Emerald Hill (`lz77eh`) a komprese
# stojí ~0 CPU a ~0 tepla => swap tu není drahý. Žádné měření latence swap-inu
# ve SPEC není, takže jakákoli hodnota by byla hádání. page-cluster=0 je dle
# SPEC už optimální. Zramu se dle zadání nedotýkám vůbec.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# SPEC neuvádí stock readahead ani I/O měření. Pro hry (PoGO = síť + malé
# náhodné čtení) bych stejně neměl podklad. Nenastavuji.
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
# Hraní při nabíjení je teplotně nejhorší kombinace, ALE strop nabíjení
# neřeší teplotu při hraní na baterii a měnil by uživateli dostupnou kapacitu
# uprostřed hry. Nenastavuji; od omezení nabíjení je `pxtune charge`.
CHARGE_STOP_LEVEL=""
