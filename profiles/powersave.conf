# =============================================================================
# pixel_tune profil: powersave  ("chladný")
# Pixel 8a / Tensor G3 "zuma" — hodnoty odvozené VÝHRADNĚ ze SPEC.md
# =============================================================================
#
# ZÁMĚR: nižší stropy, konzervativní scaling, priorita chlazení a výdrže.
#
# -----------------------------------------------------------------------------
# SPOLEČNÝ ZÁKLAD ÚVAHY (platí pro powersave / game / night)
# -----------------------------------------------------------------------------
# A) Jedinou použitelnou pákou na CPU je uclamp cgroup:
#    - `scaling_max_freq` je 0444, nejde zapsat ani jako root (SPEC, CPU clustery)
#    - cooling devices přepisuje thermal HAL ~každých 7 s (SPEC) => nepoužitelné
#    - uclamp cgroups thermal HAL NEPŘEPISUJE (SPEC) => jediná stabilní páka
#
# B) MĚŘENÍ, ze kterého odvozuji všechny stropy (SPEC, "Naměřené stock chování
#    při trvalé zátěži", 150 s / 9 jader):
#       Little ~1036 MHz = 61 % HW max
#       Big     910 MHz  = 38 % HW max
#       Prime  1164 MHz  = 40 % HW max
#       a to při junction pouhých 58 °C a skin 40,5 °C
#    => zařízení se samo drží na ~40 % HW taktu. Trvalý výkon tedy NENÍ to,
#    co by šlo shora ořezávat — je už oříznutý. Co ořezávat lze, je ŠPIČKA:
#       "špička junction v prvních ~40 s: 81 °C" (SPEC)
#    Tj. 81 °C vzniká v prvních desítkách sekund, než HAL zabere. A protože
#       "zotavení: MaxReleaseStep=1 => ~84 s; 60 s po konci zátěže se NIC
#        neuvolnilo" (SPEC)
#    je každá zbytečná špička draze zaplacená: jeden krátký peak drží telefon
#    ve škrceném stavu ještě přes minutu. Proto uclamp.max míří na špičku.
#
# C) Kalibrace čísel — NAMĚŘENÁ cpu_capacity (doplněno na zařízení):
#       cpu0-3 Little A510 = 182
#       cpu4-7 Big A715    = 725
#       cpu8   Prime X3    = 1024
#    uclamp škála 0-100 % je relativní k 1024, z čehož plynou TVRDÉ PRAHY:
#       uclamp.max <= 17,8  => util <=182  => úloha se vejde do Little
#                                             => NIKDY nesáhne na Big ani Prime
#       uclamp.max <= 70,8  => util <=725  => úloha se vejde do Big
#                                             => NIKDY nepotřebuje Prime (X3)
#       uclamp.max >  70,8                 => může vytáhnout Prime
#    Frekvence uvnitř clusteru ~ (util / capacity_clusteru) x max_freq_clusteru.
#    Pro Big (max 2367 MHz): 25 -> ~836, 30 -> ~1002, 35 -> ~1170,
#                            40 -> ~1338, 50 -> ~1672, 60 -> ~2005 MHz.
#
# D) Že uclamp.max reálně funguje, je ZMĚŘENO (4 burnery v top-app cgroup):
#       max -> Little 1385 / Big 1469 / Prime 2101 MHz
#       50  -> Little 1349 / Big 1418 / Prime 1600 MHz
#       25  -> Little 1134 / Big 1333 / Prime 1277 MHz
#    Výhrada z měření: fáze běžely za sebou a telefon se zahříval, takže část
#    poklesu jde na vrub souběžnému throttlingu. Ale ve fázi 50 byl HW strop
#    Prime 1885 MHz a průměr jen 1600 MHz — governor šel POD strop, tedy efekt
#    uclampu je prokazatelně reálný, ne artefakt teploty.
#    (Energy model v debugfs není dostupný => přesnější model spotřeby nemám.)
# -----------------------------------------------------------------------------

PROFILE_NAME="powersave"
PROFILE_DESC="Chladný — ořezaná špička, priorita teploty a výdrže"

# --- uclamp ------------------------------------------------------------------

# MIN nikde nenastavuji: uclamp.min > 0 je z definice ZVÝŠENÍ spotřeby
# (SPEC: "podlaha => rychlejší náběh => svižnost za cenu spotřeby").
# V powersave profilu to nedává smysl. Stock je 0.
UCLAMP_TOPAPP_MIN=""
UCLAMP_FG_MIN=""
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# 60 => util 614. HLAVNÍ DŮVOD (podle naměřených capacity): 60 < 70,8, takže
# se úloha vždycky vejde do Big cluster => popředí NIKDY nevytáhne Prime (X3).
# X3 je podle měření největší zdroj tepla a zóna BIG (index 0) je ta, kde se
# měřilo špičkových 81 °C.
# Fyzicky to znamená strop ~2005 MHz na Big (60/100 x 1024 / 725 x 2367).
# ODŮVODNĚNÍ VÝŠKY: ~2005 MHz leží hluboko NAD naměřeným trvalým stavem
# (Big 910 MHz = 38 %), takže NEZHORŠUJE dlouhodobý výkon — ten je stejně
# sražený na ~40 %. Ořezává jen prvních ~40 s, kde vzniká špička 81 °C.
# Kombinace "81 °C špička" + "zotavení ~84 s" znamená, že tuhle špičku se
# vyplatí obětovat: telefon se pak vůbec nedostane do hlubokého škrcení.
UCLAMP_TOPAPP_MAX="60"

# foreground = viditelné, ale ne aktivní appka. 50 => util 512 => ~1672 MHz
# na Big. Také pod prahem 70,8 => rovněž nikdy nesáhne na Prime. Nižší než
# top-app o jeden stupeň — stejná logika, ale u ne-interaktivních úloh je
# ztráta špičky ještě méně znát. Pořád výrazně nad ustálenými 910 MHz.
UCLAMP_FG_MAX="50"

# background: 30 => util 307 => ~1002 MHz na Big.
# POZOR NA PŘESNOST: 30 je NAD prahem 17,8, takže pozadí se na Big DOSTANE —
# jen tam poběží na nízké frekvenci. Zaručeně vyloučen je jen Prime (30 < 70,8).
# Proč tedy ne 17 (= striktně jen Little)? Je to VĚDOMÝ KOMPROMIS BEZ MĚŘENÍ:
# powersave je denní profil, kde sync/JobScheduler mají doběhnout v rozumném
# čase; zahnat je natvrdo na Little může kvůli race-to-idle sežrat víc energie
# celkem. Energy model v debugfs není dostupný, takže to nelze rozhodnout
# měřením. Striktní varianta (<=17) je použita v profilu `night`, kde na době
# doběhu nezáleží. Kdo chce chladněji i ve dne, přepíše tuhle hodnotu na 17.
UCLAMP_BG_MAX="30"

# system-background: 40 => util 410 => ~1338 MHz na Big; Prime vyloučen.
# 40 % odpovídá přesně úrovni, kterou si systém sám naměřeně drží pod trvalou
# zátěží (Prime 1164 MHz = 40 %). Tj. neberu systémovým službám nic, co by jim
# thermal HAL pod zátěží stejně nenechal. Níž nejdu, aby neutrpěly wakeupy
# a probouzení displeje.
UCLAMP_SYSBG_MAX="40"

# --- GPU ---------------------------------------------------------------------

# scaling_max_freq na mali DRŽÍ (SPEC: zapsáno 649000, po 12 s stále 649000),
# na rozdíl od cooling_device24, který HAL přepisuje. Bezpečná páka.
# 580000 = 5. krok shora ze seznamu (890/850/807/723/649/580...), tj. 65 %
# stock maxima. Odřezávám tři nejvyšší (a napěťově nejdražší) OPP.
# POZOR NA POCTIVOST: SPEC NEOBSAHUJE měření GPU pod trvalou zátěží (měřených
# 150 s bylo CPU-only, 9 jader). Proto NEJDU tak nízko, jak by naznačoval
# CPU-ekvivalent 40 % (to by bylo ~376000), a zůstávám výrazně konzervativnější.
GPU_MAX_FREQ="580000"

# scaling_min_freq nesahám: stock 150000 je nejnižší dostupný krok, není kam níž.
GPU_MIN_FREQ=""

# power_policy (coarse_demand/adaptive/always_on): SPEC uvádí, že volby existují,
# ale NEOBSAHUJE žádné měření jejich dopadu na spotřebu. Nehádám. Stock=adaptive.
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# Profil "game" znamená MÉNĚ throttlingu — v chladném profilu je to protismyslné.
# Prázdné = default profil HAL. Zároveň se tím nepleteme systému, který si prop
# nastavuje sám (SPEC: při probu byl na "camera").
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# NESAHÁM. zram jede na HW akcelerátoru Emerald Hill s `lz77eh`, komprese stojí
# ~0 CPU a ~0 tepla (SPEC) => swap na tomhle zařízení NENÍ zdroj spotřeby ani
# tepla, není co "šetřit". page-cluster=0 SPEC označuje za už optimální.
# Snižovat swappiness by tu bylo klasické fórové placebo.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# SPEC neuvádí stock readahead ani žádné I/O měření => nemám se čeho chytit.
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
# Strop nabíjení je rozhodnutí o dostupné kapacitě, ne o teplotě za běhu.
# Patří do `pxtune charge` (a do profilu night). Zde nesahám.
CHARGE_STOP_LEVEL=""
