# =============================================================================
# pixel_tune profil: powersave  („chladný")  — REVIZE 2026-08-08
# Pixel 8a / Tensor G3 „zuma"
# =============================================================================
#
# ZADÁNÍ TÉTO REVIZE: co nejmenší ohřev a co největší výdrž, ALE telefon musí
# zůstat použitelný, nesmí se sekat a MUSÍ zůstat 120 Hz.
#
# -----------------------------------------------------------------------------
# CO SE ZMĚNILO OPROTI PŮVODNÍ VERZI A PROČ (čti, než něco vrátíš zpět)
# -----------------------------------------------------------------------------
#
# 1) VS_DVFS_HEADROOM SNÍŽEN NA VEDLEJŠÍ ROLI.
#    Noční test (NOCNI-REPORT 01:02) naživo ukázal: po `profile powersave`
#    drží headroom=1024, ale po JAKÉMKOLI startu aplikace (LAUNCH hint) ho
#    power HAL vrátí na 1100. Tzn. přes den je headroom aktivní jen v pauzách
#    mezi spuštěními aplikací. Jako „hlavní nová páka powersave" tedy neobstál.
#    Nechávám ho (v klidu a při dlouhém čtení funguje), ale těžiště profilu
#    se vrací tam, kde věci DRŽÍ.
#
# 2) STROP TAKTU ZPŘÍSNĚN a napsán na REÁLNÝ OPP.
#    Tentýž test ukázal, že `limit_frequency` LAUNCH hint PŘEŽIJE. Je to tedy
#    jediná nová v2 páka, která se dá brát vážně. Předchozí hodnota 1852000
#    navíc není platný OPP — jádro ji zaokrouhlilo nahoru na 1885000 (viz
#    report). Teď píšu hodnoty přímo ze SPEC tabulky frekvencí.
#
# 3) GPU STROP UVOLNĚN z 580000 na 649000.
#    Původní komentář sám přiznával, že GPU pod trvalou zátěží nikdy nebylo
#    změřeno. Data, která máme, ale mluví jasně: při 150s CPU-only testu byl
#    cooling device GPU (thermal-gpufreq-0) celou dobu na NULE. GPU tedy NENÍ
#    zdroj problému, kvůli kterému tenhle profil vznikl. Zároveň je 120 Hz
#    tvrdý požadavek a každý ušetřený takt GPU se projeví přímo na plynulosti
#    scrollování. Utahovat kvůli teplu něco, co se neohřívá, je špatný obchod.
#
# 4) PŘIDÁN MEM_LRU_MIN_TTL.
#    Jediná položka celého profilu, která je ZADARMO: zlepší plynulost
#    (méně seků při návratu do aplikace) A ZÁROVEŇ ubere práci — méně refaultů
#    znamená méně dekomprese ze zramu a méně běhu kswapd.
#
# -----------------------------------------------------------------------------
# CO ZNAMENÁ „ZŮSTÁVÁ 120 Hz" PRO TENHLE PROFIL
# -----------------------------------------------------------------------------
# Panel Pixelu 8a NENÍ LTPO — umí jen 60 nebo 120 Hz, nic mezi (žádných 90).
# Aktuální stav: global min_refresh_rate=60 / peak=120. To je správně a tenhle
# profil na to NESAHÁ (a nesmí — tvrdé omezení č. 4).
#
# Praktický důsledek pro ladění: 120 Hz je FIXNÍ NÁKLAD, který se nedá obejít.
# Rozpočet na snímek je 8,3 ms místo 16,6 ms, takže render vlákno musí stihnout
# dvakrát tolik práce za sekundu. Proto tenhle profil NEJDE utáhnout tak, jak
# by šel při 60 Hz — a proto jsou stropy níž nastavené konzervativněji, než by
# se u „úsporného" profilu čekalo. Úspora se hledá jinde:
#   - ve ŠPIČCE (limit_frequency, uclamp.max), ne v ustáleném stavu
#   - v PAMĚTI (méně refaultů = méně práce)
#   - v PAUZÁCH (headroom, MIF target_load)
# nikoli ve snížení počtu snímků.
# =============================================================================

PROFILE_NAME="powersave"
PROFILE_DESC="Chladný — ořezaná špička, priorita teploty a výdrže, 120 Hz zachováno"

# --- uclamp ------------------------------------------------------------------

# MIN zůstává nenastavený. uclamp.min > 0 je z definice zvýšení spotřeby.
# V úsporném profilu nedává smysl a plynulost při 120 Hz řeší jinak: strop
# je natolik vysoko, že render vlákno nikdy nenarazí (viz kalibrace níž).
UCLAMP_TOPAPP_MIN=""
UCLAMP_FG_MIN=""
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# 60 => util 614 => ~2005 MHz na Big. BEZE ZMĚNY, a to schválně.
#
# Kalibrace (naměřené cpu_capacity: Little 182 / Big 725 / Prime 1024):
#   60 < 70,8  =>  popředí NIKDY nevytáhne Prime (X3), největší zdroj tepla.
#   ~2005 MHz je přitom víc než DVOJNÁSOBEK ustáleného stavu (Big 910 MHz),
#   takže dlouhodobý výkon to nesnižuje vůbec — ten si sráží thermal HAL sám.
#
# PROČ NEJÍT NÍŽ, když jde o úsporný profil: 120 Hz. Při 8,3 ms na snímek je
# strop 2005 MHz na Big rezerva, kterou při složitém scrollování (Chrome,
# mapy, dlouhý feed) chceš mít. Snížení na 50 (~1672 MHz) by ušetřilo málo
# a riskovalo přesně to zadrhávání, které nechceš.
UCLAMP_TOPAPP_MAX="60"

# 50 => util 512 => ~1672 MHz na Big; taky pod prahem 70,8 => Prime vyloučen.
# Viditelné, ale neaktivní procesy nevykreslují 120 Hz, takže tady si nižší
# strop dovolit můžu.
UCLAMP_FG_MAX="50"

# background: UCLAMP_BG_MAX je NO-OP, proto nenastaveno — vendor
# /proc/vendor_sched/groups/bg/uclamp_max je z výroby 130 (12,7 %), což je pod
# prahem Little (17,8 %). Agreguje se přísnější z obou, takže cokoli většího
# napsaného do /dev/cpuctl/background nemá účinek. Ověřeno probem.

# 40 => util 410 => ~1338 MHz na Big; Prime vyloučen. 40 % je přesně úroveň,
# kterou si systém pod trvalou zátěží naměřeně drží — neberu systémovým
# službám nic, co by jim HAL stejně nenechal.
UCLAMP_SYSBG_MAX="40"

# --- GPU ---------------------------------------------------------------------

# ZMĚNA: 580000 -> 649000 (o jeden krok nahoru; řada je
# 890/850/807/723/649/580/521/467/419/376/337/302/150).
#
# Odůvodnění je v hlavičce, bod 3: GPU nebylo při měření vůbec horké
# (cdev_gpu = 0 po celých 150 s), zatímco 120 Hz na plynulosti stojí a padá.
# 649000 = 73 % stock maxima; pořád jsou odříznuté tři napěťově nejdražší OPP
# (890/850/807), ale zůstává rezerva na složitou kompozici.
#
# KDYŽ BUDEŠ CHTÍT MĚŘIT: tohle je první hodnota, se kterou si hraj. Jestli
# se při 649000 telefon neohřívá o nic míň než při 580000 (a čekám, že
# neohřívá), znamená to, že GPU strop v tomhle profilu nemá co dělat vůbec.
GPU_MAX_FREQ="649000"

# stock 150000 je nejnižší krok, není kam níž.
GPU_MIN_FREQ=""

# power_policy: dopad na spotřebu nikde změřený, nehádám. Stock = adaptive.
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# Profil „game" znamená MÉNĚ škrcení — v chladném profilu protismyslné.
# Prázdné = default HAL. Zároveň se tím nepleteme systému, který si prop
# nastavuje sám (při probu byl na „camera").
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# Nesahám. zram jede na HW akcelerátoru Emerald Hill (lz77eh), komprese stojí
# ~0 CPU a ~0 tepla => swap tu není zdroj spotřeby. Snižovat swappiness by
# bylo klasické fórové placebo. (Skutečná pamětová páka je MEM_LRU_MIN_TTL
# v sekci v2 níž — ta ale nemění politiku swapu, jen chrání pracovní množinu.)
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
# Strop nabíjení je rozhodnutí o dostupné kapacitě, ne o teple za běhu.
# Patří do `pxtune charge` a do profilu night.
CHARGE_STOP_LEVEL=""

# =============================================================================
# KONTRAKT v2
# Stock hodnoty v komentářích jsou SKUTEČNÉ, ověřené probem 2026-08-07.
# =============================================================================

# --- vendor_sched (škála 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min   stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min   stock 0

# ZŮSTÁVÁ PRÁZDNÉ i po revizi. Vypadá to jako ideální úsporná páka (pozadí pod
# 130), ale power HAL ho při KAŽDÉM startu aplikace zvedá na 512. Přes den by
# se tedy jen střídalo, což je horší než konzistentní stav. Patří do `night`.
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max   stock 130

# 0 = neházet popředí na volné jádro, ale přidat ho k běžící práci. Míň
# probuzených jader = míň spotřeby, cenou je delší čekání na naplánování.
# Stock je už false, takže tohle je jen explicitní zápis záměru — necháváme
# prázdné, ať se zbytečně nezapisuje.
VS_TA_PREFER_IDLE=""        # groups/ta/prefer_idle  stock false

# PONECHÁNO, ALE DEGRADOVÁNO NA BONUS (viz hlavička bod 1).
# 1024 = „vol přesně potřebnou frekvenci" (stock 1100 = +7,4 % navíc).
# Drží jen mezi spuštěními aplikací — při dlouhém čtení, hudbě na pozadí nebo
# se zhasnutým displejem to je reálná úspora, jinak to HAL vrací.
VS_DVFS_HEADROOM="1024"

# --- sched_pixel governor ---

# Little NECHÁVÁM NA STOCKU, a je to vědomé rozhodnutí proti intuici.
# Little je podle měření nejvytíženější cluster (~1036 MHz = 61 % HW max, proti
# 38 % na Big). Nabízí se ho utáhnout — jenže když Little nestíhá, plánovač
# práci PŘESUNE NA BIG, a tam stojí každá stejná operace výrazně víc energie.
# Utažení Little by tedy spotřebu spíš zvýšilo. Nesahat bez měření.
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency  stock 1328000

# ZMĚNA: nově nastaveno. 1418000 je platný OPP z tabulky policy4
# (…1221000 1328000 1418000 1572000 1836000…). Stock limit je 1836000.
# 1418000 je pořád 1,56x ustálený stav (910 MHz), takže dlouhodobě nebere nic —
# ořezává jen prvních ~40 s, kde vzniká špička 81 °C junction.
SCHED_LIMIT_FREQ_MID="1418000"

# ZMĚNA: 1852000 -> 1557000. Dva důvody.
# (a) 1852000 NENÍ platný OPP policy8 — jádro ho zaokrouhlilo na 1885000
#     (doloženo v NOCNI-REPORT). Psát neplatné hodnoty je tichá chyba.
# (b) 1885000 bylo pro úsporný profil zbytečně vysoko. Prime se pod trvalou
#     zátěží stejně usadí na 1164 MHz, takže strop 1557000 (platný OPP, řada
#     …1298000 1557000 1745000 1885000…) neubírá z ustáleného výkonu NIC
#     a přitom je to jediná páka, která přežije LAUNCH hint.
# Prime je jediné jádro X3 a největší jednotlivý zdroj tepla — tohle je
# nejúčinnější jednotlivá hodnota v celém profilu.
SCHED_LIMIT_FREQ_BIG="1557000"

# down_rate NECHÁVÁM NA STOCKU (500 us). Stock je už extrémně agresivní —
# frekvence padá do půl milisekundy. Zvyšovat by znamenalo držet takt nahoře
# déle (opak záměru), snižovat už prakticky není kam.
SCHED_DOWN_RATE_MID=""      # policy4 down_rate_limit_us  stock 500
SCHED_DOWN_RATE_BIG=""      # policy8 down_rate_limit_us  stock 500

# --- devfreq ---
# „40 80": paměťová sběrnice se drží níž, dokud není opravdu vytížená
# (stock „20 40"). Ověřeno, že DRŽÍ (na rozdíl od headroom).
DEVFREQ_MIF_TARGET_LOAD="40 80"

# min_freq NENASTAVUJU — stock 421000 je UŽ nejnižší dostupná frekvence
# (řada …546000 421000). Není kam níž. Totéž DSU: stock 324000 = minimum.
# (Research tvrdil, že stock je 0 a jde snižovat. Probe to vyvrátil.)
DEVFREQ_MIF_MIN=""
DEVFREQ_DSU_MIN=""

# --- idle residency ---
# ZÁMĚRNĚ PRÁZDNÉ. Skutečný stock je 10000 us (ne 750000, jak tvrdil powerhint).
# Cluster se tedy uspává už po 10 ms — Google to má natvrdo dobře nastavené
# a jakákoli změna by uspávala POZDĚJI.
CPUPM_CL1_RESIDENCY=""
CPUPM_CL2_RESIDENCY=""

# --- GPU ---
# 20 ms = úspornější perioda přepočtu GPU frekvence (HAL při LAUNCH dává 10).
# Stock je shodou okolností taky 20, takže je to spíš pojistka proti tomu, aby
# v profilu zůstalo 10 po hraní.
GPU_DVFS_PERIOD="20"

# --- paměť (NOVÝ KLÍČ, vyžaduje rozšíření V2_TABLE — viz ZMENY-v2.1.md) ---
#
# 1000 ms ochrana pracovní množiny. Podle kernelové dokumentace MGLRU:
# hodnota N brání odsunutí pracovní množiny posledních N ms; N=1000 obvykle
# odstraní nesnesitelné seky způsobené thrashingem (odvozeno od lidského prahu
# vnímání ~100 ms). Stock je 0, tedy žádná ochrana.
#
# PROČ JE TO V ÚSPORNÉM PROFILU: je to jediná položka tady, která NENÍ obchod.
# Méně refaultů = méně dekomprese ze zramu = méně práce pro kswapd = méně
# spotřeby. A zároveň méně seků, což je tvůj druhý požadavek.
#
# RIZIKO: min_ttl je napojený na OOM killer — když se pracovní množina do
# paměti nevejde, něco se zabije. S 8 GB RAM a 3,7 GiB zramu je to malé.
# Kdyby ti začaly padat aplikace na pozadí, sniž na 500 nebo vynuluj.
MEM_LRU_MIN_TTL="1000"

# --- thermal, TVRDĚ HLÍDANÉ ---
THERMAL_CDEV_BYPASS=""      # do úsporného profilu nepatří ani náhodou
THERMAL_PROFILE_MAX_SKIN=""

# =============================================================================
# KANDIDÁTI, KTERÉ JSEM NEZAŘADIL (a co by je odemklo)
# =============================================================================
#
# SCHED_RESPONSE_TIME (policy4/8, stock 56 / 180 ms, nominál 52 / 178):
#   sched_pixel má uzel `response_time_ms`, který řídí, jak rychle governor
#   dojede na cílovou frekvenci. Zvýšení = pomalejší náběh = nižší špička.
#   Vypadá to jako přesně to, co powersave chce, ale sémantiku nemám doloženou
#   ze zdroje ani změřenou. NEZAŘAZUJU, dokud se nezměří.
#
# spc_threshold / pmu_limit_enable (policy8: 50 / true):
#   Governor umí poznat, že úloha čeká na paměť místo aby počítala, a v tom
#   případě takt nezvedá. Snížení prahu = přísnější posuzování = méně
#   zbytečných skoků nahoru. Elegantní úsporná páka, ale opět nezměřená.
#
# cpuset background 0-3 -> 0-1:
#   Tvrdé omezení jader pro pozadí, funguje nezávisle na uclampu a HAL ho
#   nevlastní (na rozdíl od foreground/cpus). Slibné, ale je to globální tweak
#   v registru, ne klíč profilu.
#
# DEVFREQ_MIF_MAX (stock 3744000):
#   Strop paměťové sběrnice by ubral špičkovou spotřebu, ale při 120 Hz je
#   paměťová propustnost přesně to, co drží plynulé scrollování. Proti zadání.
#
# CO POWERSAVE NEUMÍ VŮBEC a přitom to je pravděpodobně největší žrout:
#   modem (Tensor G3, slabý signál 5G) a jas displeje. Ani jedno není sysfs
#   uzel, na který by tenhle modul dosáhl. Jestli hledáš skokovou úsporu
#   a ne procenta, začni tam.
