# =============================================================================
# pixel_tune profile: powersave  — REVISION 2026-08-13 (MAX BATTERY)
# Pixel 8a / Tensor G3 "zuma"
# =============================================================================
#
# INTENT: powersave = MAXIMUM battery life, no overheating, nothing else.
# The constraints it must NOT break:
#   - 120 Hz stays on (smooth display),
#   - the phone is not sluggish, it handles everyday tasks, Pokemon GO
#     and light multitasking.
#
# COMPARED TO THE PREVIOUS VERSION ("cool with headroom"): this one is
# deliberately more aggressive. The CPU/GPU/memory-bus ceilings sit lower,
# because the goal is no longer just temperature but the lowest possible power
# draw. The line is drawn where 120 Hz scrolling and PoGO (60 fps) are still
# smooth — below that it starts to stutter, so we do not go further.
#
# TUNING BY FEEL: UCLAMP_TOPAPP_MAX, GPU_MAX_FREQ and SCHED_LIMIT_FREQ_BIG are
# the main levers. If the phone still feels snappy, each can be pulled down one
# step (more battery). If something stutters, raise it one step.
# =============================================================================

PROFILE_NAME="powersave"
PROFILE_DESC="Maximum battery life — trimmed CPU/GPU peaks, 120 Hz and PoGO preserved"

# --- uclamp (performance ceiling per process class) --------------------------
# MIN stays empty: uclamp.min > 0 = permanently higher power draw, which has no
# place in a power-saving profile. Smoothness at 120 Hz is handled by a high
# enough MAX, not by a floor.
UCLAMP_TOPAPP_MIN=""
UCLAMP_FG_MIN=""
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# 52 % => util ~532 => ~1736 MHz on the Big cluster. Below the 70.8 % threshold,
# so the foreground NEVER pulls in Prime (X3) — the single largest source of
# both heat and power draw. 1736 MHz is still almost 2x the sustained state
# (Big ~910 MHz under continuous load), so it does not cost long-term
# performance; it only trims short spikes. PoGO runs at 60 fps and 120 Hz
# scrolling still has headroom.
UCLAMP_TOPAPP_MAX="52"

# 42 % => visible but inactive apps (they do not render at 120 Hz) get less.
UCLAMP_FG_MAX="42"

# 33 % => background system services. Kept below the Little threshold; the HAL
# would not give them more than that anyway.
UCLAMP_SYSBG_MAX="33"

# --- GPU Mali ----------------------------------------------------------------
# 580000 (one step down from 649000). The series: 890/850/807/723/649/580/521/...
# The GPU was never hot under load, but for maximum battery a lower ceiling
# makes sense: a lower GPU clock = lower draw both while scrolling and in PoGO.
# 580 MHz carries 120 Hz UI composition as well as PoGO (60 fps, light on GPU).
GPU_MAX_FREQ="580000"
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profile (left alone, default) -------------------------------
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm (left alone: zram on the lz77eh HW accelerator = ~0 CPU/heat) --------
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
IO_READAHEAD_KB=""

# --- charging (belongs in `pxtune charge` / night, not here) -----------------
CHARGE_STOP_LEVEL=""

# =============================================================================
# v2 CONTRACT — governor / vendor_sched / devfreq / memory
# =============================================================================

VS_TA_UCLAMP_MIN=""
VS_FG_UCLAMP_MIN=""
VS_BG_UCLAMP_MAX=""

VS_TA_PREFER_IDLE=""

# 1024 = "pick exactly the frequency needed" (stock 1100 = +7.4 % on top). It
# pays off mostly during idle gaps and with the screen off — pure savings there.
VS_DVFS_HEADROOM="1024"

# --- sched_pixel governor: clock ceilings (they survive the LAUNCH hint) -----
# Little is LEFT at stock: it is the busiest cluster, and when it cannot keep
# up the work moves to Big, where it costs more energy. Squeezing Little would
# raise power draw.
SCHED_LIMIT_FREQ_LITTLE=""

# 1328000 (down from 1418000, a valid policy4 OPP). Still 1.46x the sustained
# state (910 MHz), so it does not cost sustained performance; it only trims the
# spike where the junction heat is generated.
SCHED_LIMIT_FREQ_MID="1328000"

# 1298000 (down from 1557000, a valid policy8 OPP). Under continuous load Prime
# settles around 1164 MHz anyway, so this ceiling takes almost nothing off
# sustained performance and is the single most effective lever for both heat
# and power draw (Prime = the only X3).
SCHED_LIMIT_FREQ_BIG="1298000"

SCHED_DOWN_RATE_MID=""
SCHED_DOWN_RATE_BIG=""

# --- devfreq (memory bus) ----------------------------------------------------
# "50 90": MIF stays lower until it is genuinely busy (more aggressive than the
# earlier "40 80", stock is "20 40"). Saves memory-bus power while idle.
DEVFREQ_MIF_TARGET_LOAD="50 90"
DEVFREQ_MIF_MIN=""
DEVFREQ_DSU_MIN=""

# --- idle residency (Google has this right, do not touch) --------------------
CPUPM_CL1_RESIDENCY=""
CPUPM_CL2_RESIDENCY=""

# --- GPU dvfs period ---------------------------------------------------------
GPU_DVFS_PERIOD="20"

# --- memory: working-set protection (free — fewer stutters AND less work) ----
# 1000 ms protects the last second's working set from being pushed into zram.
# Fewer refaults = less decompression = less kswapd work = less power, and at
# the same time fewer stutters when returning to an app. If background apps
# start getting killed, lower it to 500 or clear it.
MEM_LRU_MIN_TTL="1000"

# --- thermal (a bypass has no place in a power-saving profile) ---------------
THERMAL_CDEV_BYPASS=""
THERMAL_PROFILE_MAX_SKIN=""
