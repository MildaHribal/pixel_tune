# =============================================================================
# pixel_tune profile: powersave  ("cool")  — REVISED 2026-08-08
# Pixel 8a / Tensor G3 "zuma"
# =============================================================================
#
# GOAL OF THIS REVISION: the least possible heat and the longest possible
# battery life, BUT the phone must stay usable, must not stutter and MUST
# stay at 120 Hz.
#
# -----------------------------------------------------------------------------
# WHAT CHANGED SINCE THE ORIGINAL VERSION AND WHY (read before reverting)
# -----------------------------------------------------------------------------
#
# 1) VS_DVFS_HEADROOM DEMOTED TO A SIDE ROLE.
#    The night-time test (NIGHT-REPORT 01:02) showed live: after
#    `profile powersave` the headroom holds at 1024, but after ANY app start
#    (LAUNCH hint) the power HAL puts it back to 1100. So during the day the
#    headroom is only active in the gaps between app launches. It did not hold
#    up as "the main new powersave lever". I am keeping it (it works while
#    idle and during long reading sessions), but the centre of gravity of the
#    profile moves back to the things that STICK.
#
# 2) CLOCK CAP TIGHTENED and written to a REAL OPP.
#    The same test showed that `limit_frequency` SURVIVES the LAUNCH hint. It
#    is therefore the one new v2 lever that can be taken seriously. On top of
#    that, the previous value 1852000 is not a valid OPP — the kernel rounded
#    it up to 1885000 (see the report). Values now come straight from the SPEC
#    frequency tables.
#
# 3) GPU CAP RELAXED from 580000 to 649000.
#    The original comment admitted itself that the GPU had never been measured
#    under sustained load. The data we do have is unambiguous: during the
#    150 s CPU-only test the GPU cooling device (thermal-gpufreq-0) sat at
#    ZERO the whole time. The GPU is therefore NOT the source of the problem
#    this profile was created for. At the same time 120 Hz is a hard
#    requirement, and every GPU clock step saved shows up directly in scroll
#    smoothness. Tightening something that does not get hot, in the name of
#    heat, is a bad trade.
#
# 4) MEM_LRU_MIN_TTL ADDED.
#    The one item in the whole profile that is FREE: it improves smoothness
#    (fewer stalls when returning to an app) AND removes work at the same time
#    — fewer refaults means less decompression from zram and less kswapd.
#
# -----------------------------------------------------------------------------
# WHAT "120 Hz STAYS" MEANS FOR THIS PROFILE
# -----------------------------------------------------------------------------
# The Pixel 8a panel is NOT LTPO — it can only do 60 or 120 Hz, nothing in
# between (there is no 90). Current state: global min_refresh_rate=60 /
# peak=120. That is correct and this profile DOES NOT TOUCH it (and must not
# — hard constraint #4).
#
# The practical consequence for tuning: 120 Hz is a FIXED COST that cannot be
# worked around. The frame budget is 8.3 ms instead of 16.6 ms, so the render
# thread has to get twice as much work done per second. That is why this
# profile cannot be tightened the way it could be at 60 Hz — and why the caps
# below are set more conservatively than you would expect from a "power
# saving" profile. The savings are looked for elsewhere:
#   - in the PEAK (limit_frequency, uclamp.max), not in the steady state
#   - in MEMORY (fewer refaults = less work)
#   - in the GAPS (headroom, MIF target_load)
# and not in dropping frames.
# =============================================================================

PROFILE_NAME="powersave"
PROFILE_DESC="Cool — trimmed peak, temperature and battery first, 120 Hz preserved"

# --- uclamp ------------------------------------------------------------------

# MIN stays unset. uclamp.min > 0 is by definition an increase in power draw.
# It makes no sense in a power saving profile, and smoothness at 120 Hz is
# handled differently: the cap is high enough that the render thread never
# hits it (see calibration below).
UCLAMP_TOPAPP_MIN=""
UCLAMP_FG_MIN=""
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# 60 => util 614 => ~2005 MHz on Big. UNCHANGED, and deliberately so.
#
# Calibration (measured cpu_capacity: Little 182 / Big 725 / Prime 1024):
#   60 < 70.8  =>  the foreground NEVER pulls in Prime (X3), the largest heat
#   source. And ~2005 MHz is more than TWICE the steady state (Big 910 MHz),
#   so it does not reduce sustained performance at all — the thermal HAL cuts
#   that down by itself anyway.
#
# WHY NOT GO LOWER in a power saving profile: 120 Hz. With 8.3 ms per frame,
# a 2005 MHz cap on Big is headroom you want to have for heavy scrolling
# (Chrome, maps, a long feed). Dropping to 50 (~1672 MHz) would save little
# and risk exactly the stuttering you do not want.
UCLAMP_TOPAPP_MAX="60"

# 50 => util 512 => ~1672 MHz on Big; also below the 70.8 threshold => Prime
# excluded. Visible but inactive processes are not rendering at 120 Hz, so a
# lower cap is affordable here.
UCLAMP_FG_MAX="50"

# background: UCLAMP_BG_MAX is a NO-OP and therefore unset — the vendor node
# /proc/vendor_sched/groups/bg/uclamp_max ships at 130 (12.7 %), which is
# below the Little threshold (17.8 %). The stricter of the two is what
# applies, so anything larger written into /dev/cpuctl/background has no
# effect. Verified with the probe.

# 40 => util 410 => ~1338 MHz on Big; Prime excluded. 40 % is exactly the
# level the system measurably holds under sustained load — I am not taking
# anything from system services that the HAL would not leave them anyway.
UCLAMP_SYSBG_MAX="40"

# --- GPU ---------------------------------------------------------------------

# CHANGE: 580000 -> 649000 (one step up; the series is
# 890/850/807/723/649/580/521/467/419/376/337/302/150).
#
# The reasoning is in the header, point 3: the GPU was not hot at all during
# the measurement (cdev_gpu = 0 for the whole 150 s), while 120 Hz lives and
# dies on smoothness. 649000 = 73 % of the stock maximum; the three most
# voltage-expensive OPPs (890/850/807) are still cut off, but there is
# headroom left for heavy composition.
#
# IF YOU WANT TO MEASURE: this is the first value to play with. If the phone
# gets no cooler at 649000 than at 580000 (and I expect it does not), that
# means the GPU cap has no business being in this profile at all.
GPU_MAX_FREQ="649000"

# stock 150000 is the lowest step, there is nowhere lower to go.
GPU_MIN_FREQ=""

# power_policy: the effect on power draw has not been measured anywhere, and
# I am not guessing. Stock = adaptive.
GPU_POWER_POLICY=""

# --- thermal HAL profile -----------------------------------------------------
# The "game" profile means LESS throttling — counterproductive in a cool
# profile. Empty = HAL default. It also keeps us out of the way of the system,
# which sets the prop on its own (during the probe it was on "camera").
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# Hands off. zram runs on the Emerald Hill hardware accelerator (lz77eh),
# compression costs ~0 CPU and ~0 heat => swap is not a power drain here.
# Lowering swappiness would be classic forum placebo. (The real memory lever
# is MEM_LRU_MIN_TTL in the v2 section below — but that does not change swap
# policy, it only protects the working set.)
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
IO_READAHEAD_KB=""

# --- charging ----------------------------------------------------------------
# A charge cap is a decision about available capacity, not about heat during
# operation. It belongs in `pxtune charge` and in the night profile.
CHARGE_STOP_LEVEL=""

# =============================================================================
# CONTRACT v2
# Stock values in the comments are REAL, verified by the probe on 2026-08-07.
# =============================================================================

# --- vendor_sched (scale 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min   stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min   stock 0

# STAYS EMPTY even after the revision. It looks like the ideal power saving
# lever (background below 130), but the power HAL raises it to 512 on EVERY
# app start. Over a day it would just flip back and forth, which is worse than
# a consistent state. It belongs in `night`.
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max   stock 130

# 0 = do not throw the foreground onto an idle core, add it to running work
# instead. Fewer woken cores = less power, at the cost of a longer wait to be
# scheduled. Stock is already false, so this would only be an explicit
# statement of intent — left empty so nothing is written needlessly.
VS_TA_PREFER_IDLE=""        # groups/ta/prefer_idle  stock false

# KEPT, BUT DEMOTED TO A BONUS (see header point 1).
# 1024 = "pick exactly the frequency needed" (stock 1100 = +7.4 % on top).
# It only holds between app launches — during long reading, background music
# or with the screen off it is a real saving, otherwise the HAL reverts it.
VS_DVFS_HEADROOM="1024"

# --- sched_pixel governor ---

# Little is LEFT AT STOCK, and that is a deliberate decision against
# intuition. Measurements show Little is the busiest cluster (~1036 MHz = 61 %
# of HW max, versus 38 % on Big). Tightening it suggests itself — except that
# when Little cannot keep up, the scheduler MOVES the work TO BIG, where the
# same operation costs considerably more energy. Tightening Little would
# therefore be more likely to raise power draw. Do not touch without
# measurements.
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency  stock 1328000

# CHANGE: newly set. 1418000 is a valid OPP from the policy4 table
# (…1221000 1328000 1418000 1572000 1836000…). The stock limit is 1836000.
# 1418000 is still 1.56x the steady state (910 MHz), so it takes nothing away
# long term — it only trims the first ~40 s, where the 81 °C junction peak
# forms.
SCHED_LIMIT_FREQ_MID="1418000"

# CHANGE: 1852000 -> 1557000. Two reasons.
# (a) 1852000 is NOT a valid policy8 OPP — the kernel rounded it to 1885000
#     (documented in NIGHT-REPORT). Writing invalid values is a silent bug.
# (b) 1885000 was needlessly high for a power saving profile. Prime settles at
#     1164 MHz under sustained load anyway, so a cap of 1557000 (a valid OPP,
#     series …1298000 1557000 1745000 1885000…) takes NOTHING off sustained
#     performance while being the only lever that survives the LAUNCH hint.
# Prime is the single X3 core and the largest individual heat source — this is
# the most effective single value in the whole profile.
SCHED_LIMIT_FREQ_BIG="1557000"

# down_rate LEFT AT STOCK (500 us). Stock is already extremely aggressive —
# the frequency falls within half a millisecond. Raising it would mean holding
# clocks up longer (the opposite of the intent), and there is practically
# nowhere lower to go.
SCHED_DOWN_RATE_MID=""      # policy4 down_rate_limit_us  stock 500
SCHED_DOWN_RATE_BIG=""      # policy8 down_rate_limit_us  stock 500

# --- devfreq ---
# "40 80": the memory bus stays lower until it is genuinely busy (stock
# "20 40"). Verified to STICK (unlike the headroom).
DEVFREQ_MIF_TARGET_LOAD="40 80"

# min_freq NOT SET — stock 421000 is ALREADY the lowest available frequency
# (series …546000 421000). There is nowhere lower. Same for DSU: stock 324000
# = the minimum. (The research claimed stock was 0 and could be lowered. The
# probe disproved it.)
DEVFREQ_MIF_MIN=""
DEVFREQ_DSU_MIN=""

# --- idle residency ---
# DELIBERATELY EMPTY. The real stock is 10000 us (not 750000 as the powerhint
# claimed). The cluster therefore already powers down after 10 ms — Google has
# this set right out of the box and any change would power it down LATER.
CPUPM_CL1_RESIDENCY=""
CPUPM_CL2_RESIDENCY=""

# --- GPU ---
# 20 ms = the more economical GPU frequency re-evaluation period (the HAL uses
# 10 on LAUNCH). Stock happens to be 20 as well, so this is more of an
# insurance policy against 10 being left behind after gaming.
GPU_DVFS_PERIOD="20"

# --- memory (NEW KEY, requires extending V2_TABLE — see CHANGES-v2.1.md) ---
#
# 1000 ms of working-set protection. Per the kernel MGLRU documentation: a
# value of N prevents eviction of the working set of the last N ms; N=1000
# usually removes the unbearable stalls caused by thrashing (derived from the
# ~100 ms human perception threshold). Stock is 0, i.e. no protection.
#
# WHY IT IS IN A POWER SAVING PROFILE: it is the only item here that is not a
# trade-off. Fewer refaults = less decompression from zram = less work for
# kswapd = less power. And fewer stalls at the same time, which is your second
# requirement.
#
# RISK: min_ttl is wired to the OOM killer — if the working set does not fit
# in memory, something gets killed. With 8 GB of RAM and 3.7 GiB of zram that
# risk is small. If background apps start dying, lower it to 500 or zero it.
MEM_LRU_MIN_TTL="1000"

# --- thermal, STRICTLY GUARDED ---
THERMAL_CDEV_BYPASS=""      # has no place whatsoever in a cool profile
THERMAL_PROFILE_MAX_SKIN=""

# =============================================================================
# CANDIDATES I DID NOT INCLUDE (and what would unlock them)
# =============================================================================
#
# SCHED_RESPONSE_TIME (policy4/8, stock 56 / 180 ms, nominal 52 / 178):
#   sched_pixel has a `response_time_ms` node controlling how fast the
#   governor ramps to the target frequency. Raising it = slower ramp = lower
#   peak. It looks like exactly what powersave wants, but I have neither
#   source-level nor measured confirmation of its semantics. NOT INCLUDED
#   until it is measured.
#
# spc_threshold / pmu_limit_enable (policy8: 50 / true):
#   The governor can tell that a task is waiting on memory rather than
#   computing, and in that case it does not raise the clock. Lowering the
#   threshold = stricter judgement = fewer pointless jumps upward. An elegant
#   power saving lever, but again unmeasured.
#
# cpuset background 0-3 -> 0-1:
#   A hard core-mask restriction for the background; works independently of
#   uclamp and is not owned by the HAL (unlike foreground/cpus). Promising,
#   but it is a global tweak in the registry, not a profile key.
#
# DEVFREQ_MIF_MAX (stock 3744000):
#   Capping the memory bus would cut peak power, but at 120 Hz memory
#   bandwidth is exactly what keeps scrolling smooth. Against the brief.
#
# WHAT POWERSAVE CANNOT DO AT ALL, and what is probably the biggest drain:
#   the modem (Tensor G3, weak 5G signal) and display brightness. Neither is a
#   sysfs node this module can reach. If you are looking for a step change in
#   battery life rather than percentages, start there.
