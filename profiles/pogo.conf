# =============================================================================
# pixel_tune profile: pogo  (long outdoor gaming sessions)
# Pixel 8a / Tensor G3 "zuma"
#
# NEW PROFILE. It exists because `game` and Pokémon GO want opposite things.
#
# `game` sets vendor.thermal.VIRTUAL-SKIN-CPU-{MID,HIGH}.profile to "game".
# Per device/google/akita/thermal_info_config_akita.json, that gives all three
# CPU cooling devices "Disabled": true — i.e. it DISABLES throttling from two
# of the four sensors that cause it. That is right for a short, demanding
# session where you want to exploit the phone's thermal inertia.
#
# For a game that runs for two hours outdoors it is exactly the other way
# round. The measured self-heating ceiling under full load on all nine cores
# is 40.5 °C skin, and the first CPU-MID threshold is 41.0 °C. In the sun you
# will cross it even without any load.
# The goal is therefore not to extract performance but to cut it back to the
# level the game still needs, and to postpone the moment the skin reaches
# 41 °C — because recovery has MaxReleaseStep=1, i.e. ~84 s, with nothing
# released in the first 60 s.
#
# Combines with apps/com.nianticlabs.pokemongo.conf, which adds Game Mode
# (downscale 0.7 and a 60 fps cap) and locks the panel to 60 Hz.
# =============================================================================

PROFILE_NAME="pogo"
PROFILE_DESC="Outdoor gaming — a ceiling instead of a peak, surface temperature first"

# --- uclamp ------------------------------------------------------------------

# 30 => util 307 => a floor of ~1002 MHz on Big (307/725 x 2367).
# Between frames the render thread does not fall to a low OPP, so the next
# frame does not start from zero. That is what keeps frame-time stable at
# 60 fps. 30 < the 38 % steady state => the floor does not fight the thermal
# HAL.
UCLAMP_TOPAPP_MIN="30"

# 50 => util 512 => ~1672 MHz on Big. THIS IS THE MAIN DIFFERENCE FROM `game`,
# which leaves the cap at "max".
# 50 < 70.8 => Prime (X3) will NEVER wake up for the game. Prime is the
# largest individual heat source and PoGO does not need it — it is a Unity
# game with a simple scene. 1672 MHz is still almost twice the steady
# 910 MHz, so it will not show up as stuttering.
UCLAMP_TOPAPP_MAX="50"

# foreground: hands off. I have no measurement of what actually sits in this
# group for PoGO (audio, game services, the network thread), and a blanket cap
# there could cause audio glitches or micro-stutters while the map loads.
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""

# background DELIBERATELY EMPTY.
# Per powerhint-akita.json, /proc/vendor_sched/groups/bg/uclamp_max is stock
# 130 out of 1024, i.e. 12.7 %. The Little threshold is 182/1024 = 17.8 %.
# Google therefore keeps the background off the big cores out of the box, and
# anything I wrote into /dev/cpuctl/background (30 => 307, 17 => 174) would be
# LOOSER, i.e. without effect. The stricter of the two values applies.
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""

# 40 => util 410 => ~1338 MHz on Big; Prime excluded.
# 40 % is exactly the level the system holds by itself under sustained load.
# I take nothing from system services that the HAL would not leave them
# anyway, but I keep them out of the thermal peak. No lower, because wakeups
# and GPS go through system-background — and with PoGO that is the last thing
# you want to slow down.
UCLAMP_SYSBG_MAX="40"
UCLAMP_SYSBG_MIN=""

# --- GPU ---------------------------------------------------------------------

# 723000 = the third step from the top (890/850/807/723), i.e. ~81 % of the
# stock maximum. Together with GAME_DOWNSCALE=0.7 in the per-app rule, this
# means the GPU does roughly half the work at a fifth lower frequency — and it
# still holds 60 fps on a PoGO scene.
# This is not guesswork: during the measured 150 s CPU-only test cdev_gpu
# (thermal-gpufreq-0) stayed at zero the whole time, so the GPU has plenty of
# headroom.
GPU_MAX_FREQ="723000"

# scaling_min_freq is at its lowest stock step, nowhere lower to go.
GPU_MIN_FREQ=""

# power_policy left alone — the effect of the individual policies on power
# draw has not been measured, and `always_on` would be directly harmful here.
GPU_POWER_POLICY=""

# --- thermal HAL profile -----------------------------------------------------
# EMPTY, AND THAT IS THE ENTIRE POINT OF THIS PROFILE. See the header.
# DO NOT change this to "game" until you have measured that your phone does
# not go above 43 °C skin during an hour-long session.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# Hands off. zram runs on the Emerald Hill hardware accelerator (`lz77eh`),
# compression costs ~0 CPU and ~0 heat, so swap is not a power drain here.
# page-cluster=0 is already optimal.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# PoGO is network plus small random reads; readahead would not help here and
# the stock value has not been measured anyway.
IO_READAHEAD_KB=""

# --- charging ----------------------------------------------------------------
# DO NOT SET. During an outdoor session you need the full capacity and a cap
# would take it away mid-game. `pxtune charge` and the `night` profile are
# there for limiting charge.
# (Note: playing while charging is the worst possible thermal combination —
# charging alone adds several degrees to the skin.)
CHARGE_STOP_LEVEL=""


# =============================================================================
# CONTRACT v2 — ACTIVATED 2026-08-08 (previously commented out entirely)
# =============================================================================
# The reason it was commented out was "writability on Android 16 has not been
# verified". That NO LONGER HOLDS: the probe on 2026-08-07
# (probe-analysis-2026-08-07.md) measured these nodes live, including
# permissions and stock values, and the powersave / night / game / performance
# profiles have been built on them ever since. The stock values in the
# comments below are REAL measurements, not from the powerhint.

# --- vendor_sched (/proc/vendor_sched, scale 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min       stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min       stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max       stock 130 — already keeps background off the big cores
VS_TA_PREFER_IDLE=""        # groups/ta/prefer_idle      stock false — wakes an extra core, not wanted outdoors
# No frequency overshoot. Stock 1100 means a clock 7.4 % higher than
# utilisation calls for; 1024 means picking exactly what is needed. For a game
# running for hours at a steady load, headroom is a pure loss.
# CAUTION: the power HAL returns the headroom to 1100 on every app start
# (verified live, NIGHT-REPORT 01:02) — outdoors it therefore only applies
# between launches. A bonus, not the main lever; the main lever is the clock
# cap below.
VS_DVFS_HEADROOM="1024"     # dvfs_headroom              stock 1100

# --- sched_pixel governor ---
# A hard clock cap. Both values are VALID OPPs from the SPEC tables (policy8
# contains 1557000, policy4 contains 1418000), so the kernel will not snap
# them elsewhere.
#
# This complements rather than replaces UCLAMP_TOPAPP_MAX=50 above: uclamp
# decides WHERE the task is placed (keeping it below the 70.8 threshold =>
# off Prime), limit_frequency decides HOW HIGH the clock of the whole policy
# may go, including system threads. After this, the binding limit on Big is
# limit_frequency (1418 MHz), not uclamp (~1672 MHz) — and that is intended:
# outdoors in the sun, the surface ceiling matters more than the peak.
#
# CLOSED 2026-08-08 — verified live, the cap SURVIVES the LAUNCH hint.
# powersave was applied (same values), three apps were launched, both caps
# held; that the hint fired is proven by dvfs_headroom, which changed
# 1024 -> 1100 in the same sample.
# For an outdoor profile that is the good news: the cap applies even during
# full use, so the profile keeps its effect even when you switch away from the
# game now and then.
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency    stock 1328000
SCHED_LIMIT_FREQ_MID="1418000"  # policy4 limit_frequency  stock 1836000
SCHED_LIMIT_FREQ_BIG="1557000"  # policy8 limit_frequency  stock 2363000
# Holding the clock up between touches DOES NOT BELONG in this profile: PoGO
# is largely waiting on the network and GPS, not continuous rendering.
# Stock 500 = drop immediately.
SCHED_DOWN_RATE_MID=""      # policy4 down_rate_limit_us  stock 500  (probe; NOT 20000)
SCHED_DOWN_RATE_BIG=""      # policy8 down_rate_limit_us  stock 500  (probe; NOT 20000)

# --- devfreq ---
# The memory bus stays lower until it is genuinely busy. The same value as in
# powersave; with a 60 fps cap there is nothing more to push through.
DEVFREQ_MIF_TARGET_LOAD="40 80"  # mif interactive/target_load  stock "20 40" (probe)
DEVFREQ_DSU_MIN=""          # dsu min_freq               stock 324000 (probe) — already the lowest available
DEVFREQ_MIF_MIN=""          # mif min_freq               stock 421000 (probe) — already the lowest available

# --- idle residency ---
# DELIBERATELY NOT DEPLOYED. The research proposed 100000 (100 ms) on the
# grounds that stock was 750000 — except the probe on 2026-08-07 showed the
# REAL stock cpd_cl2_target_residency = 10000 (10 ms). Setting 100000 would
# power the cluster down LATER, i.e. the exact opposite of the intended
# saving.
CPUPM_CL1_RESIDENCY=""      # cpd_cl1_target_residency   REAL stock 10000 (probe; NOT 750000)
CPUPM_CL2_RESIDENCY=""      # cpd_cl2_target_residency   REAL stock 10000 (probe; NOT 750000)

# --- GPU ---
# A 20 ms GPU frequency re-evaluation period instead of 10. At a stable 60 fps
# there is nothing to recompute faster.
GPU_DVFS_PERIOD="20"        # mali dvfs_period  10|20 ms  stock 20 (probe)

# --- memory ---
# 1000 ms of working-set protection. PoGO has a large working set and outdoors
# you routinely switch away from it (map, messages, camera) — without
# protection the pages get pulled back out of zram on return, which is the
# stall during which you miss the spawn.
MEM_LRU_MIN_TTL="1000"      # /sys/kernel/mm/lru_gen/min_ttl_ms  stock 0 (probe)

# --- thermal, STRICTLY GUARDED ---
# Neither belongs in an outdoor profile: pogo deploys NO THERMAL_PROFILE_* at
# all (it does not want to disable skin sensors while the phone lies in the
# sun) and CDEV_BYPASS even less so.
THERMAL_CDEV_BYPASS=""      # 0|1 — runtime skin-throttling kill switch
THERMAL_PROFILE_MAX_SKIN="" # °C — pogo deploys no THERMAL_PROFILE_*
