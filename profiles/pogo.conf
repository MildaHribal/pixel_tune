# =============================================================================
# pixel_tune profil: pogo  (dlouhé venkovní herní relace)
# Pixel 8a / Tensor G3 "zuma"
#
# NOVÝ PROFIL. Vznikl proto, že `game` a Pokémon GO chtějí opačné věci.
#
# `game` nastavuje vendor.thermal.VIRTUAL-SKIN-CPU-{MID,HIGH}.profile na
# "game". Podle device/google/akita/thermal_info_config_akita.json to má
# u všech tří CPU cooling devices "Disabled": true — tedy VYPÍNÁ škrcení
# ze dvou ze čtyř senzorů, které ho způsobují. To je správné pro krátkou
# náročnou hru, kde chceš vytěžit tepelnou setrvačnost telefonu.
#
# Pro hru, která běží dvě hodiny venku, je to přesně naopak. Naměřený strop
# vlastního ohřevu při plné zátěži všech devíti jader je skin 40,5 °C, a
# první práh CPU-MID je 41,0 °C. Na slunci ho překročíš i bez zátěže.
# Cílem tedy není vytěžit výkon, ale snížit ho na úroveň, kterou hra ještě
# potřebuje, a oddálit okamžik, kdy se skin dostane na 41 °C — protože
# zotavení má MaxReleaseStep=1, tedy ~84 s, a prvních 60 s se neuvolní nic.
#
# Kombinuje se s apps/com.nianticlabs.pokemongo.conf, který přidává
# Game Mode (downscale 0,7 a strop 60 fps) a zamyká panel na 60 Hz.
# =============================================================================

PROFILE_NAME="pogo"
PROFILE_DESC="Venkovní hraní — strop místo špičky, priorita teploty povrchu"

# --- uclamp ------------------------------------------------------------------

# 30 => util 307 => ~1002 MHz podlaha na Big (307/725 x 2367).
# Render vlákno mezi snímky nespadne na nízké OPP, takže další snímek
# nezačíná z nuly. To je to, co drží stabilní frame-time při 60 fps.
# 30 < 38 % ustáleného stavu => podlaha nebojuje s thermal HALem.
UCLAMP_TOPAPP_MIN="30"

# 50 => util 512 => ~1672 MHz na Big. TOHLE JE HLAVNÍ ROZDÍL PROTI `game`,
# který strop nechává na "max".
# 50 < 70,8 => Prime (X3) se kvůli hře NIKDY neprobudí. Prime je největší
# jednotlivý zdroj tepla a PoGO ho nepotřebuje — je to Unity hra s
# jednoduchou scénou. 1672 MHz je pořád skoro dvojnásobek ustálených
# 910 MHz, takže se to neprojeví jako zadrhávání.
UCLAMP_TOPAPP_MAX="50"

# foreground: nesahám. Nemám měření, co v téhle skupině u PoGO reálně sedí
# (audio, herní služby, síťové vlákno), a paušální strop by mohl způsobit
# trhání zvuku nebo mikroseky při načítání mapy.
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""

# background ZÁMĚRNĚ PRÁZDNÉ.
# Podle powerhint-akita.json je /proc/vendor_sched/groups/bg/uclamp_max
# stock 130 z 1024, tedy 12,7 %. Práh Little je 182/1024 = 17,8 %.
# Google tedy pozadí drží mimo velká jádra už z výroby a cokoli, co bych
# napsal do /dev/cpuctl/background (30 => 307, 17 => 174), by bylo
# VOLNĚJŠÍ, tedy bez účinku. Platí přísnější z obou hodnot.
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""

# 40 => util 410 => ~1338 MHz na Big; Prime vyloučen.
# 40 % je přesně úroveň, kterou si systém pod trvalou zátěží sám drží.
# Neberu systémovým službám nic, co by jim HAL stejně nenechal, ale
# zabraňuji jim v teplotní špičce. Níž ne, protože přes system-background
# jdou wakeupy a GPS — a to je u PoGO to poslední, co chceš zpomalit.
UCLAMP_SYSBG_MAX="40"
UCLAMP_SYSBG_MIN=""

# --- GPU ---------------------------------------------------------------------

# 723000 = třetí krok shora (890/850/807/723), tedy ~81 % stock maxima.
# Spolu s GAME_DOWNSCALE=0.7 v per-app pravidle to znamená, že GPU dělá
# zhruba poloviční práci na o pětinu nižší frekvenci — a 60 fps na scéně
# PoGO to pořád zvládne.
# Není to hádání: při naměřeném 150s CPU-only testu zůstal cdev_gpu
# (thermal-gpufreq-0) celou dobu na nule, takže GPU má velkou rezervu.
GPU_MAX_FREQ="723000"

# scaling_min_freq je stock na nejnižším kroku, není kam níž.
GPU_MIN_FREQ=""

# power_policy nesahám — dopad jednotlivých politik na spotřebu není
# změřený a `always_on` by tu byl přímo škodlivý.
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# PRÁZDNÉ, A JE TO CELÝ SMYSL TOHOHLE PROFILU. Viz hlavička.
# NEPŘEPISUJ tohle na "game", dokud si neproměříš, že ti telefon při
# hodinové relaci nevyskočí nad 43 °C skin.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# Nesahám. zram jede na HW akcelerátoru Emerald Hill (`lz77eh`), komprese
# stojí ~0 CPU a ~0 tepla, takže swap tu není zdroj spotřeby. page-cluster=0
# je už optimální.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# PoGO je síť plus malá náhodná čtení; readahead by tu nepomohl a stock
# hodnota stejně není naměřená.
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
# NENASTAVOVAT. Při venkovní relaci potřebuješ celou kapacitu a strop by ti
# ji uprostřed hry sebral. Od omezení nabíjení je `pxtune charge` a profil
# `night`.
# (Pozn.: hrát a zároveň nabíjet je teplotně nejhorší možná kombinace —
# nabíjení samo přidává na skin několik stupňů.)
CHARGE_STOP_LEVEL=""


# =============================================================================
# KONTRAKT v2 — AKTIVOVÁNO 2026-08-08 (dřív bylo celé zakomentované)
# =============================================================================
# Důvod, proč to bylo zakomentované, byl „zapisovatelnost na Androidu 16 není
# ověřená". To už NEPLATÍ: probe 2026-08-07 (probe-analiza-2026-08-07.md) tyhle
# uzly proměřil naživo včetně práv a stock hodnot, a profily powersave / night /
# game / performance na nich od té doby stojí. Stock hodnoty v komentářích níž
# jsou SKUTEČNÉ naměřené, ne z powerhintu.

# --- vendor_sched (/proc/vendor_sched, škála 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min       stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min       stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max       stock 130 — už drží pozadí mimo velká jádra
VS_TA_PREFER_IDLE=""        # groups/ta/prefer_idle      stock false — probouzí jádro navíc, venku nechceme
# Bez přestřelování frekvence. Stock 1100 znamená o 7,4 % vyšší takt, než je
# podle utilizace potřeba; 1024 znamená volit přesně. U hry, která běží hodiny
# na ustálené zátěži, je headroom čirá ztráta.
# POZOR: power HAL headroom vrací na 1100 při každém startu aplikace (ověřeno
# naživo, NOCNI-REPORT 01:02) — venku tedy platí jen mezi spuštěními. Bonus, ne
# hlavní páka; hlavní pákou je strop taktu níž.
VS_DVFS_HEADROOM="1024"     # dvfs_headroom              stock 1100

# --- sched_pixel governor ---
# Tvrdý strop taktu. Obě hodnoty jsou PLATNÉ OPP ze SPEC tabulek (policy8
# obsahuje 1557000, policy4 obsahuje 1418000), takže je kernel nesnapuje jinam.
#
# Doplňuje, ne nahrazuje UCLAMP_TOPAPP_MAX=50 výš: uclamp řeší, KAM se úloha
# umístí (drží ji pod prahem 70,8 => mimo Prime), limit_frequency řeží, JAK
# VYSOKO smí vyjet takt celé policy včetně systémových vláken. Po tomhle je na
# Big binding limit_frequency (1418 MHz), ne uclamp (~1672 MHz) — a je to tak
# zamýšlené: venku na slunci je strop povrchu důležitější než špička.
#
# ZAVŘENO 2026-08-08 — ověřeno naživo, strop LAUNCH hint PŘEŽIJE. Nasazen
# powersave (stejné hodnoty), spuštěny tři aplikace, oba stropy držely; že hint
# proběhl, dokazuje dvfs_headroom, který se ve stejném vzorku změnil 1024 -> 1100.
# Pro venkovní profil je to ta dobrá zpráva: strop platí i za plného používání,
# takže nese účinek profilu i tehdy, když mezi hraním odskakuješ jinam.
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency    stock 1328000
SCHED_LIMIT_FREQ_MID="1418000"  # policy4 limit_frequency  stock 1836000
SCHED_LIMIT_FREQ_BIG="1557000"  # policy8 limit_frequency  stock 2363000
# Držet takt nahoře mezi doteky do tohohle profilu NEPATŘÍ: PoGO je z velké
# části čekání na síť a GPS, ne souvislé renderování. Stock 500 = spadni hned.
SCHED_DOWN_RATE_MID=""      # policy4 down_rate_limit_us  stock 500  (probe; NE 20000)
SCHED_DOWN_RATE_BIG=""      # policy8 down_rate_limit_us  stock 500  (probe; NE 20000)

# --- devfreq ---
# Paměťová sběrnice se drží níž, dokud není opravdu vytížená. Stejná hodnota
# jako v powersave; při 60 fps capu není co víc propouštět.
DEVFREQ_MIF_TARGET_LOAD="40 80"  # mif interactive/target_load  stock "20 40" (probe)
DEVFREQ_DSU_MIN=""          # dsu min_freq               stock 324000 (probe) — už nejnižší dostupná
DEVFREQ_MIF_MIN=""          # mif min_freq               stock 421000 (probe) — už nejnižší dostupná

# --- idle residency ---
# ZÁMĚRNĚ NENASAZOVAT. Research navrhoval 100000 (100 ms) s odůvodněním, že
# stock je 750000 — jenže probe 2026-08-07 ukázal SKUTEČNÝ stock
# cpd_cl2_target_residency = 10000 (10 ms). Nastavit 100000 by cluster uspávalo
# POZDĚJI, tedy přesně opak zamýšlené úspory.
CPUPM_CL1_RESIDENCY=""      # cpd_cl1_target_residency   SKUTEČNÝ stock 10000 (probe; NE 750000)
CPUPM_CL2_RESIDENCY=""      # cpd_cl2_target_residency   SKUTEČNÝ stock 10000 (probe; NE 750000)

# --- GPU ---
# 20 ms perioda přepočtu GPU frekvence místo 10. Při stabilních 60 fps není co
# přepočítávat rychleji.
GPU_DVFS_PERIOD="20"        # mali dvfs_period  10|20 ms  stock 20 (probe)

# --- paměť ---
# 1000 ms ochrany pracovní množiny. PoGO má velkou pracovní množinu a venku se
# z něj běžně odskakuje (mapa, zprávy, foťák) — bez ochrany se po návratu tahají
# stránky zpátky ze zramu, což je ten sek, kdy ti uteče spawn.
MEM_LRU_MIN_TTL="1000"      # /sys/kernel/mm/lru_gen/min_ttl_ms  stock 0 (probe)

# --- thermal, TVRDĚ HLÍDANÉ ---
# Do venkovního profilu nepatří ani jedno: pogo NEnasazuje žádný THERMAL_PROFILE_*
# (nechce vypínat skin senzory, když telefon leží na slunci) a CDEV_BYPASS už
# vůbec ne.
THERMAL_CDEV_BYPASS=""      # 0|1 — runtime vypínač skin-throttlingu
THERMAL_PROFILE_MAX_SKIN="" # °C — pogo nenasazuje žádný THERMAL_PROFILE_*
