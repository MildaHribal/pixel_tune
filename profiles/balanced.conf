# =============================================================================
# pixel_tune profil: balanced  (DEFAULT)
# Pixel 8a / Tensor G3 "zuma" — hodnoty odvozené VÝHRADNĚ ze SPEC.md
# =============================================================================
#
# ZÁMĚR: default profil. Má být co nejblíž stocku. Něco měním jen tehdy,
# když SPEC obsahuje MĚŘENÍ, které dokazuje, že stock hodnota je špatně.
#
# ZÁVĚR: takové měření ve SPEC NENÍ. Proto je tento profil záměrně
# CELÝ PRÁZDNÝ = čistý stock. Není to nedodělek, je to výsledek.
#
# Co konkrétně jsem zvažoval a proč jsem to NEZMĚNIL:
#
# 1) uclamp (SPEC "uclamp cgroups"): stock je min=0.00 / max=max všude
#    (kromě nnapi-hal min=1.00, na to nesaháme, není v kontraktu).
#    Jakýkoli uclamp.max < 100 = ztráta výkonu, jakýkoli uclamp.min > 0 =
#    vyšší spotřeba. Ani jedno není u defaultu žádoucí a SPEC neobsahuje
#    měření, které by ukazovalo, že stock 0/max je pro běžné použití vadné.
#
# 2) CPU stropy: `scaling_max_freq` je 0444, nejde zapsat ani jako root
#    (SPEC, "CPU clustery"). Cooling devices sice zapisovatelné jsou, ale
#    thermal HAL je přepisuje ~každých 7 s (SPEC) => nepoužitelné.
#    Tedy: strop CPU se v balanced ani nemá čím posunout.
#
# 3) Thermal profil (setprop vendor.thermal.*.profile): NEOVĚŘENO, že
#    reálně funguje. Do defaultního profilu neověřený mechanismus nepatří.
#    Navíc SPEC: "systém si tento prop nastavuje sám (při probu byl už na
#    camera)" => default profil do toho nesmí skákat vůbec.
#
# 4) GPU: stock scaling_max_freq = 890000 = HW maximum. Nahoru není kam,
#    dolů = ztráta výkonu bez důvodu.
#
# 5) vm: SPEC uvádí stock swappiness=60, dirty_ratio=20, dirty_bg=10,
#    vfs_cache_pressure=100 a explicitně, že page-cluster=0 je "už optimální
#    pro zram". Žádné měření, které by ukazovalo problém => nesahat.
#    Pozn.: zram používá `lz77eh` na HW akcelerátoru Emerald Hill
#    (~0 CPU, ~0 tepla) => swap je na tomhle zařízení levný, což je další
#    důvod stock swappiness neponižovat.
#
# 6) I/O readahead: SPEC neuvádí ANI stock hodnotu, ANI žádné měření I/O.
#    => čisté hádání, nenastavuji. (OTEVŘENÁ OTÁZKA, viz report.)
#
# 7) charge_stop_level: baterie má 602 cyklů, limit 80 je ověřeně
#    zapisovatelný. ALE snížení stropu nabíjení je uživatelské rozhodnutí
#    o dostupné kapacitě, ne oprava chyby. V defaultu se nesahá; patří to
#    do `pxtune charge` a do profilu `night`.
# =============================================================================

PROFILE_NAME="balanced"
PROFILE_DESC="Vyvážený — čistý stock, žádné zásahy (default)"

# uclamp — stock je min=0 / max=max, neměníme
UCLAMP_TOPAPP_MIN=""
UCLAMP_TOPAPP_MAX=""
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""
UCLAMP_SYSBG_MIN=""
UCLAMP_SYSBG_MAX=""

# GPU — stock 890000 / 150000 / adaptive
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# thermal HAL profil — neověřený mechanismus, do defaultu nepatří
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# vm — stock hodnoty jsou dle SPEC v pořádku
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# I/O — SPEC neuvádí stock ani měření
IO_READAHEAD_KB=""

# nabíjení — uživatelské rozhodnutí, ne default
CHARGE_STOP_LEVEL=""
