# =============================================================================
# pixel_tune profil: balanced  (DEFAULT)  — REVIZE 2026-08-08
# Pixel 8a / Tensor G3 „zuma"
# =============================================================================
#
# ZMĚNA CHARTY PROFILU — přečti tohle, než se podivíš, že tu něco je.
#
# Původní balanced byl ZÁMĚRNĚ CELÝ PRÁZDNÝ = čistý stock, s odůvodněním
# „měnit se má jen to, o čem SPEC dokazuje, že je špatně". To byl správný
# postoj v době, kdy jsme neměli probe ani měření.
#
# Nové zadání: balanced má být rychlý a plynulý, s co nejrychlejším
# přepínáním mezi otevřenými aplikacemi — při zachování toho, že se telefon
# nepřehřívá a baterie zůstává optimalizovaná.
#
# „Čistý stock" je teď dostupný přes `pxtune revert`. Balanced přestává být
# synonymem stocku a stává se profilem s vlastním záměrem.
#
# -----------------------------------------------------------------------------
# ANALÝZA: CO VE SKUTEČNOSTI ROZHODUJE O RYCHLOSTI PŘEPNUTÍ APLIKACE
# -----------------------------------------------------------------------------
#
# Tohle je nejdůležitější odstavec celého souboru, protože vede k profilu,
# který vypadá jinak, než by člověk čekal.
#
# Přepnutí do aplikace, která už běží, se rozpadá na tři části:
#
#   (1) NAJÍT JEJÍ STRÁNKY V PAMĚTI.
#       Když ji mezitím systém odsunul do zramu, musí se dekomprimovat zpátky.
#       Tohle je JEDINÁ část, která umí trvat stovky milisekund a je zdaleka
#       nejčastější příčinou pocitu „appka se znovu načítá".
#
#   (2) ROZBĚHNOUT PROCESOR.
#       Tady nemá cenu se snažit: power HAL při každém startu aplikace pouští
#       hint LAUNCH, který na 5 sekund zvedne groups/ta/uclamp_min na 765,
#       dvfs_headroom na 1280 a odstropuje scaling_max_freq. Ověřeno naživo
#       (NOCNI-REPORT 01:02). Cokoli, co bych sem napsal, je slabší než to,
#       co Google dělá sám. Zásah do CPU by přepínání NEZRYCHLIL.
#
#   (3) VYKRESLIT PRVNÍ SNÍMEK.
#       Při 120 Hz je rozpočet 8,3 ms. Řeší se rychlostí náběhu, ne stropem.
#
# ZÁVĚR: těžiště tohohle profilu je PAMĚŤ, ne procesor. Proto je tu jediná
# opravdu podstatná hodnota MEM_LRU_MIN_TTL, dvě drobnosti pro plynulost —
# a žádné uclamp podlahy, které by jen topily.
#
# -----------------------------------------------------------------------------
# PROČ SE TÍM TELEFON NEBUDE PŘEHŘÍVAT
# -----------------------------------------------------------------------------
# Nic v tomhle profilu nezvyšuje strop výkonu — ten se ani zvýšit nedá
# (thermal HAL si sráží takt sám podle teploty POVRCHU, prahy 39 / 41 / 43 °C).
# Zvyšuje se jen rychlost REAKCE a snižuje objem zbytečné práce s pamětí.
# Ochrana pracovní množiny dokonce práci ubírá: méně refaultů = méně
# dekomprese ze zramu = méně běhu kswapd.
# =============================================================================

PROFILE_NAME="balanced"
PROFILE_DESC="Vyvážený — plynulost a rychlé přepínání aplikací (default)"

# --- uclamp ------------------------------------------------------------------
#
# VŠECHNO ZŮSTÁVÁ PRÁZDNÉ, a je to hlavní designové rozhodnutí profilu.
#
# Proč tu NENÍ UCLAMP_TOPAPP_MIN, když jde o svižnost:
# uclamp.min je podlaha, která platí POŘÁD, dokud je aplikace v popředí — tedy
# i během hodiny čtení, kdy se nic neděje. Zaplatíš ji celý den, ale využiješ
# ji jen v prvních desetinách sekundy po přepnutí. A přesně ty desetiny
# sekundy už pokrývá LAUNCH hint od power HALu hodnotou 765/1024, kterou
# stejně nepřebiješ. Byla by to čistá ztráta baterie a tepla za nic.
#
# Proč tu NENÍ žádný strop: strop výkon jen bere. V profilu, který má být
# rychlý, nemá co dělat.
UCLAMP_TOPAPP_MIN=""
UCLAMP_TOPAPP_MAX=""
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""
UCLAMP_SYSBG_MIN=""
UCLAMP_SYSBG_MAX=""

# --- GPU ---------------------------------------------------------------------
# Stock 890000 = HW maximum. Nahoru není kam, dolů = ztráta plynulosti při
# 120 Hz bez teplotního zisku (GPU cooling device byl při 150s testu celou
# dobu na nule — GPU na tomhle zařízení nebylo nikdy problém).
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# Do defaultu nepatří. Systém si prop nastavuje sám (kamera), nebudeme mu tam
# skákat. A profil „game" (méně škrcení) je pro celodenní default nesmysl.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
#
# NESAHÁM, a to ani na swappiness — což u profilu zaměřeného na přepínání
# aplikací vypadá jako opomenutí, ale není.
#
# Obvyklá rada „sniž swappiness, ať se appky neodswapují" je na tomhle
# zařízení špatně. zram jede na HW akcelerátoru Emerald Hill (lz77eh),
# komprese i dekomprese stojí ~0 CPU a ~0 tepla. Stránka v zramu je tu
# LEVNÁ — mnohem levnější než aplikace zabitá kvůli nedostatku paměti.
# Snížením swappiness bys tedy netlačil systém k „držení aplikací v RAM",
# ale k jejich zabíjení.
#
# Správný nástroj pro tenhle cíl je MEM_LRU_MIN_TTL níž: ten nemění politiku
# swapu, jen zakáže odsunout to, co jsi právě používal.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
CHARGE_STOP_LEVEL=""

# =============================================================================
# KONTRAKT v2
# =============================================================================

# --- vendor_sched ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min  stock 1  — viz rozbor výš, LAUNCH hint to dělá líp
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min  stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max  stock 130 — už tak drží pozadí mimo velká jádra
VS_DVFS_HEADROOM=""         # stock 1100 — nezvyšovat; HAL při LAUNCH sám dává 1280

# ZMĚNA: nově zapnuto (stock false).
# Když se přepneš do aplikace, plánovač jí najde jádro, které zrovna nic
# nedělá, místo aby ji přidal k běžící práci. Zkracuje to čekání na naplánování
# a je to znát právě u přepínání a scrollování.
#
# CENA: probudí se jádro navíc, tedy vyšší spotřeba v aktivním používání.
# Je to jediná položka tohohle profilu, která něco stojí — a je tu proto, že
# přesně tohle si HAL při LAUNCH taky zapíná (ta/prefer_idle -> 1). Tady
# to platí i mezi launchi, tedy při scrollování v jedné aplikaci.
#
# KDYBY TI VADILA SPOTŘEBA: tohle vyhoď jako první, ne MEM_LRU_MIN_TTL.
VS_TA_PREFER_IDLE="1"

# --- sched_pixel governor ---
SCHED_LIMIT_FREQ_LITTLE=""  # stock 1328000 — default nestropuje
SCHED_LIMIT_FREQ_MID=""     # stock 1836000
SCHED_LIMIT_FREQ_BIG=""     # stock 2363000

# ZMĚNA: 500 -> 3000 us na obou velkých clusterech.
#
# Stock 500 us znamená, že frekvence smí klesnout každou půl milisekundu.
# Prakticky: zvedneš prst mezi dvěma pohyby při scrollování a takt spadne,
# takže další pohyb startuje odspodu. To je přesně ten pocit „první tah je
# líný, pak už to jede".
#
# 3000 us (3 ms) drží takt přes mezeru mezi dvěma doteky, ale pořád je to
# hluboko pod rozpočtem snímku při 120 Hz (8,3 ms), takže po skutečném
# skončení práce frekvence spadne ještě před dalším snímkem. Cena na baterii
# je proto malá — držíš takt o milisekundy, ne o desetiny sekundy.
#
# Little schválně NEMĚNÍM: tam je stock down_rate taky 500, ale Little běží
# skoro pořád, takže by se tam z toho stal trvalý příplatek.
SCHED_DOWN_RATE_MID="3000"
SCHED_DOWN_RATE_BIG="3000"

# --- devfreq ---
# NESAHÁM. Stock „20 40" znamená, že paměťová sběrnice zrychluje už při 20 %
# vytížení — je tedy nastavená spíš na výkon než na úsporu, což je pro tenhle
# profil správně. (Powersave to naopak posouvá na „40 80".)
DEVFREQ_MIF_TARGET_LOAD=""
DEVFREQ_MIF_MIN=""          # stock 421000 = už nejnižší dostupná
DEVFREQ_DSU_MIN=""          # stock 324000 = už nejnižší dostupná

# --- idle residency ---
# Stock 10000 us. Google to má dobře, nesahat.
CPUPM_CL1_RESIDENCY=""
CPUPM_CL2_RESIDENCY=""

# --- GPU ---
GPU_DVFS_PERIOD=""          # stock 20; HAL při LAUNCH sám dává 10

# --- paměť (NOVÝ KLÍČ, vyžaduje rozšíření V2_TABLE — viz ZMENY-v2.1.md) ---
#
# TOHLE JE HLAVNÍ HODNOTA CELÉHO PROFILU.
#
# Podle kernelové dokumentace MGLRU brání hodnota N odsunutí pracovní množiny
# posledních N milisekund; N=1000 obvykle odstraní nesnesitelné seky způsobené
# thrashingem, protože práh lidského vnímání je kolem 100 ms. Stock je 0 —
# žádná ochrana, cokoli se smí odsunout kdykoli.
#
# Přeloženo do tvého případu: aplikace, mezi kterými přepínáš, jsou z definice
# ty, které jsi používal v posledních sekundách. Právě jejich stránky tenhle
# klíč chrání před odsunutím do zramu. To je ta část (1) z rozboru v hlavičce —
# jediná, na kterou máš vliv.
#
# 1000 ms je doporučená hodnota z dokumentace. 3000 ms by seky srazilo ještě
# víc, ale za cenu předčasného zabíjení aplikací — na 8 GB to nemá smysl
# riskovat.
#
# RIZIKO: min_ttl je napojený na OOM killer. Když se chráněná množina do
# paměti nevejde, systém něco zabije. Poznáš to tak, že ti začnou mizet
# aplikace z přehledu. Pak sniž na 500.
MEM_LRU_MIN_TTL="1000"

# --- thermal ---
THERMAL_CDEV_BYPASS=""
THERMAL_PROFILE_MAX_SKIN=""

# =============================================================================
# CO TENHLE PROFIL VĚDOMĚ NEDĚLÁ
# =============================================================================
#
# Nezvyšuje strop výkonu. Nejde to — thermal HAL si takt sráží podle teploty
# povrchu bez ohledu na profil, a `scaling_max_freq` sice teď vypadá
# zapisovatelně (664 system:system, ne 0444 jak tvrdila stará SPEC), ale HAL
# ho při každém LAUNCH stejně vrací. Sliby o „odemčení plného výkonu" by tady
# byly lež.
#
# Nenastavuje uclamp podlahy. Viz rozbor v hlavičce — LAUNCH hint je silnější
# a podlaha by se platila celý den za zisk v prvních 300 ms.
#
# Nesahá na refresh rate. 120 Hz zůstává (tvrdé omezení č. 4).
#
# NEJVĚTŠÍ ZBÝVAJÍCÍ PÁKA NA RYCHLOST PŘEPÍNÁNÍ, KTEROU PROFIL NEUMÍ:
# aplikace, které se do paměti vůbec nevejdou. Když máš otevřených dvacet
# appek, žádná ochrana pracovní množiny je tam neudrží. Na to je
# `pxtune dexopt <balicek>` (zrychlí studený start) a debloat pozadí.
