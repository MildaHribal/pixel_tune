# =============================================================================
# pixel_tune profile: balanced  (DEFAULT)  — REVISED 2026-08-08
# Pixel 8a / Tensor G3 "zuma"
# =============================================================================
#
# CHANGE OF CHARTER — read this before wondering why anything is in here.
#
# The original balanced was DELIBERATELY EMPTY = pure stock, on the grounds
# that "only change what the SPEC proves is wrong". That was the right stance
# back when we had neither the probe nor any measurements.
#
# New goal: balanced should be fast and smooth, with the quickest possible
# switching between open apps — while keeping the phone from overheating and
# the battery well behaved.
#
# "Pure stock" now lives in `pxtune revert`. Balanced stops being a synonym
# for stock and becomes a profile with an intent of its own.
#
# -----------------------------------------------------------------------------
# ANALYSIS: WHAT ACTUALLY DECIDES HOW FAST AN APP SWITCH FEELS
# -----------------------------------------------------------------------------
#
# This is the most important paragraph in the file, because it leads to a
# profile that looks different from what you would expect.
#
# Switching to an app that is already running breaks down into three parts:
#
#   (1) FINDING ITS PAGES IN MEMORY.
#       If the system has pushed them out to zram in the meantime, they have
#       to be decompressed back. This is the ONLY part that can take hundreds
#       of milliseconds, and it is by far the most common cause of the
#       "the app is reloading itself" feeling.
#
#   (2) SPINNING THE CPU UP.
#       Not worth trying here: on every app start the power HAL fires the
#       LAUNCH hint, which for 5 seconds raises groups/ta/uclamp_min to 765
#       and dvfs_headroom to 1280, and lifts the scaling_max_freq cap.
#       Verified live (NIGHT-REPORT 01:02). Anything I could write here is
#       weaker than what Google already does on its own. Touching the CPU
#       would NOT make switching faster.
#
#   (3) DRAWING THE FIRST FRAME.
#       At 120 Hz the budget is 8.3 ms. That is won by ramp-up speed, not by
#       a frequency cap.
#
# CONCLUSION: the centre of gravity of this profile is MEMORY, not the CPU.
# Hence the one genuinely significant value MEM_LRU_MIN_TTL, two small
# smoothness tweaks — and no uclamp floors that would only generate heat.
#
# -----------------------------------------------------------------------------
# WHY THIS WILL NOT MAKE THE PHONE OVERHEAT
# -----------------------------------------------------------------------------
# Nothing in this profile raises the performance ceiling — it cannot even be
# raised (the thermal HAL cuts clocks on its own based on SURFACE temperature,
# thresholds 39 / 41 / 43 °C). What goes up is REACTION speed, and what goes
# down is the amount of pointless memory work. Working-set protection actually
# removes work: fewer refaults = less decompression from zram = less kswapd.
# =============================================================================

PROFILE_NAME="balanced"
PROFILE_DESC="Balanced — smoothness and fast app switching (default)"

# --- uclamp ------------------------------------------------------------------
#
# EVERYTHING STAYS EMPTY, and that is the profile's main design decision.
#
# Why there is NO UCLAMP_TOPAPP_MIN even though this is about responsiveness:
# uclamp.min is a floor that applies ALL THE TIME while the app is in the
# foreground — including an hour of reading where nothing happens. You pay
# for it all day but only benefit from it in the first few tenths of a second
# after a switch. And those exact tenths are already covered by the power
# HAL's LAUNCH hint at 765/1024, which you cannot outbid anyway. It would be
# pure battery and heat spent on nothing.
#
# Why there is no cap: a cap only takes performance away. It has no place in
# a profile that is supposed to be fast.
UCLAMP_TOPAPP_MIN=""
UCLAMP_TOPAPP_MAX=""
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""
UCLAMP_SYSBG_MIN=""
UCLAMP_SYSBG_MAX=""

# --- GPU ---------------------------------------------------------------------
# Stock 890000 = the HW maximum. There is no room above, and going below
# means losing smoothness at 120 Hz with no thermal gain (the GPU cooling
# device sat at zero for the whole 150 s test — the GPU has never been the
# problem on this device).
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profile -----------------------------------------------------
# Does not belong in the default. The system sets this prop itself (camera)
# and we are not going to jump in there. And the "game" profile (less
# throttling) makes no sense as an all-day default.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
#
# HANDS OFF, including swappiness — which in a profile aimed at app switching
# looks like an oversight, but is not.
#
# The usual advice "lower swappiness so apps don't get swapped out" is wrong
# on this device. zram runs on the Emerald Hill hardware accelerator (lz77eh);
# compression and decompression cost ~0 CPU and ~0 heat. A page in zram is
# CHEAP here — far cheaper than an app killed for lack of memory. Lowering
# swappiness would therefore not push the system towards "keeping apps in
# RAM", but towards killing them.
#
# The right tool for this goal is MEM_LRU_MIN_TTL below: it does not change
# the swap policy, it merely forbids evicting what you were just using.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
IO_READAHEAD_KB=""

# --- charging ----------------------------------------------------------------
CHARGE_STOP_LEVEL=""

# =============================================================================
# CONTRACT v2
# =============================================================================

# --- vendor_sched ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min  stock 1  — see analysis above, the LAUNCH hint does it better
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min  stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max  stock 130 — already keeps background off the big cores
VS_DVFS_HEADROOM=""         # stock 1100 — do not raise; the HAL itself gives 1280 on LAUNCH

# CHANGE: newly enabled (stock false).
# When you switch to an app, the scheduler finds it a core that is currently
# idle instead of piling it on top of running work. That shortens the wait to
# be scheduled, and it shows exactly during switching and scrolling.
#
# COST: one more core wakes up, so higher power draw during active use. It is
# the only item in this profile that costs anything — and it is here because
# this is precisely what the HAL turns on for LAUNCH as well
# (ta/prefer_idle -> 1). Here it applies between launches too, i.e. while
# scrolling inside a single app.
#
# IF POWER DRAW BOTHERS YOU: drop this first, not MEM_LRU_MIN_TTL.
VS_TA_PREFER_IDLE="1"

# --- sched_pixel governor ---
SCHED_LIMIT_FREQ_LITTLE=""  # stock 1328000 — the default does not cap
SCHED_LIMIT_FREQ_MID=""     # stock 1836000
SCHED_LIMIT_FREQ_BIG=""     # stock 2363000

# CHANGE: 500 -> 3000 us on both big clusters.
#
# Stock 500 us means the frequency may drop every half millisecond. In
# practice: you lift your finger between two scroll flicks and the clock
# falls, so the next flick starts from the bottom. That is exactly the
# "the first swipe is sluggish, then it's fine" feeling.
#
# 3000 us (3 ms) holds the clock across the gap between two touches, yet is
# still far below the frame budget at 120 Hz (8.3 ms), so once the work
# really ends the frequency drops before the next frame anyway. The battery
# cost is therefore small — you hold the clock for milliseconds, not for
# tenths of a second.
#
# Little is deliberately UNTOUCHED: its stock down_rate is also 500, but
# Little runs almost all the time, so there it would become a permanent
# surcharge.
SCHED_DOWN_RATE_MID="3000"
SCHED_DOWN_RATE_BIG="3000"

# --- devfreq ---
# HANDS OFF. Stock "20 40" means the memory bus speeds up at 20 % utilisation
# already — it is tuned towards performance rather than saving, which is
# right for this profile. (Powersave moves it to "40 80" instead.)
DEVFREQ_MIF_TARGET_LOAD=""
DEVFREQ_MIF_MIN=""          # stock 421000 = already the lowest available
DEVFREQ_DSU_MIN=""          # stock 324000 = already the lowest available

# --- idle residency ---
# Stock 10000 us. Google has this right, leave it alone.
CPUPM_CL1_RESIDENCY=""
CPUPM_CL2_RESIDENCY=""

# --- GPU ---
GPU_DVFS_PERIOD=""          # stock 20; the HAL itself gives 10 on LAUNCH

# --- memory (NEW KEY, requires extending V2_TABLE — see CHANGES-v2.1.md) ---
#
# THIS IS THE MAIN VALUE OF THE WHOLE PROFILE.
#
# Per the kernel MGLRU documentation, a value of N prevents eviction of the
# working set of the last N milliseconds; N=1000 usually removes the
# unbearable stalls caused by thrashing, because the threshold of human
# perception is around 100 ms. Stock is 0 — no protection at all, anything
# may be evicted at any time.
#
# Translated into your case: the apps you switch between are by definition
# the ones you used in the last few seconds. Their pages are exactly what
# this key protects from being pushed into zram. That is part (1) from the
# analysis in the header — the only one you can influence.
#
# 1000 ms is the value recommended by the documentation. 3000 ms would cut
# the stalls even further, but at the price of apps being killed early — not
# worth the risk on 8 GB.
#
# RISK: min_ttl is wired to the OOM killer. If the protected set does not fit
# in memory, the system kills something. You will notice it as apps
# disappearing from the recents list. Lower it to 500 in that case.
MEM_LRU_MIN_TTL="1000"

# --- thermal ---
THERMAL_CDEV_BYPASS=""
THERMAL_PROFILE_MAX_SKIN=""

# =============================================================================
# WHAT THIS PROFILE DELIBERATELY DOES NOT DO
# =============================================================================
#
# It does not raise the performance ceiling. That is impossible — the thermal
# HAL cuts clocks by SURFACE temperature regardless of the profile, and while
# `scaling_max_freq` now does look writable (664 system:system, not 0444 as
# the old SPEC claimed), the HAL restores it on every LAUNCH anyway. Promises
# of "unlocking full performance" would be a lie here.
#
# It sets no uclamp floors. See the analysis in the header — the LAUNCH hint
# is stronger, and a floor would be paid for all day for a gain in the first
# 300 ms.
#
# It does not touch the refresh rate. 120 Hz stays (hard constraint #4).
#
# THE BIGGEST REMAINING LEVER ON SWITCHING SPEED THAT THIS PROFILE CANNOT
# PULL: apps that simply do not fit in memory at all. With twenty apps open,
# no working-set protection will keep them there. For that there is
# `pxtune dexopt <package>` (faster cold start) and debloating the background.
