# =============================================================================
# pixel_tune profile: balanced  (DEFAULT)  — REVISION 2026-08-13
# Pixel 8a / Tensor G3 "zuma"
# =============================================================================
#
# INTENT: smoothness first — nothing stutters, everything glides — but the
# phone stays tuned towards battery rather than performance. So: do NOT raise
# the peak above stock, DO make the response snappy and app switching fast.
#
# HOW YOU GET "SMOOTH" WITHOUT RAISING THE PEAK:
#   1) A uclamp FLOOR for the foreground — the render thread never drops to the
#      lowest OPP mid-interaction (no more "the first swipe is lazy, then it
#      picks up").
#   2) LONGER FREQUENCY HOLD (down_rate) — the clock does not collapse between
#      two touches.
#   3) MEMORY PROTECTION (min_ttl) — the apps you switch between are not pushed
#      into zram, so they do not "reload from scratch".
#   4) prefer_idle — a task switch gets an idle core instead of queueing.
# None of these levers raises the performance ceiling (it cannot be raised
# anyway — the thermal HAL pulls it back down). They only improve LATENCY and
# reduce the amount of pointless work.
#
# BATTERY-LEANING: the only item that actually costs anything is the uclamp
# floor (and prefer_idle, mildly). It is deliberately kept low — just enough
# for smoothness, not enough to be a performance profile. If battery life drops
# too much, lower UCLAMP_TOPAPP_MIN or clear it.
# =============================================================================

PROFILE_NAME="balanced"
PROFILE_DESC="Balanced — smooth and quick to switch, still battery-leaning (default)"

# --- uclamp ------------------------------------------------------------------
# The foreground FLOOR is the main new smoothness lever. 20 % keeps the render
# thread above the lowest OPPs, so scrolling and animations ramp up instantly.
# It is the only permanent cost of this profile; deliberately low so that this
# does not turn into a performance profile.
UCLAMP_TOPAPP_MIN="20"
# No ceiling: balanced does not take performance away.
UCLAMP_TOPAPP_MAX=""
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""
UCLAMP_SYSBG_MIN=""
UCLAMP_SYSBG_MAX=""

# --- GPU (stock = full smoothness, 890 = HW max) -----------------------------
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm (left alone — zram is cheap on the HW accelerator) -------------------
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

IO_READAHEAD_KB=""
CHARGE_STOP_LEVEL=""

# =============================================================================
# v2 CONTRACT
# =============================================================================

VS_TA_UCLAMP_MIN=""
VS_FG_UCLAMP_MIN=""
VS_BG_UCLAMP_MAX=""
VS_DVFS_HEADROOM=""

# prefer_idle: switching into an app gets an idle core instead of being stacked
# onto running work => shorter scheduling latency, noticeable when switching
# apps and while scrolling.
VS_TA_PREFER_IDLE="1"

SCHED_LIMIT_FREQ_LITTLE=""
SCHED_LIMIT_FREQ_MID=""
SCHED_LIMIT_FREQ_BIG=""

# down_rate 3000 us holds the clock across the gap between two touches (stock
# 500 us = it collapses every half millisecond => lazy first swipe). 3 ms is
# still well inside the 120 Hz frame budget (8.3 ms), so once the work is done
# the clock still drops before the next frame => a small battery cost. Little
# is left alone (it runs almost constantly => a permanent surcharge).
SCHED_DOWN_RATE_MID="3000"
SCHED_DOWN_RATE_BIG="3000"

# --- devfreq (stock "20 40" = a snappy memory bus = smoothness) --------------
DEVFREQ_MIF_TARGET_LOAD=""
DEVFREQ_MIF_MIN=""
DEVFREQ_DSU_MIN=""

CPUPM_CL1_RESIDENCY=""
CPUPM_CL2_RESIDENCY=""
GPU_DVFS_PERIOD=""

# --- memory: working-set protection (the main fast-switching lever) ----------
# 1500 ms (more than powersave's 1000) — the apps you switch between stay in
# RAM and do not "reload from scratch". 8 GB of RAM can carry that. If apps
# start disappearing from Recents, lower it to 1000.
MEM_LRU_MIN_TTL="1500"

THERMAL_CDEV_BYPASS=""
THERMAL_PROFILE_MAX_SKIN=""
