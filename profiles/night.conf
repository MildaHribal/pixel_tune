# =============================================================================
# pixel_tune profil: night  (telefon leží na stole)
# Pixel 8a / Tensor G3 "zuma" — hodnoty odvozené VÝHRADNĚ ze SPEC.md
# =============================================================================
#
# ZÁMĚR: minimální výkon na pozadí, maximální úspora. Nikdo se nedívá.
#
# STRATEGIE: v tomhle profilu je JEDINÝM smysluplným cílem pozadí. Top-app
# skupina je při zhasnutém displeji buď prázdná, nebo v ní sedí naposledy
# použitá appka, která nic nekreslí. Proto tady těžiště leží na
# background / system-background, na rozdíl od ostatních profilů.
#
# Kalibrace podle NAMĚŘENÝCH cpu_capacity (Little 182 / Big 725 / Prime 1024,
# uclamp škála 0-100 % je relativní k 1024) — podrobně viz powersave.conf:
#    uclamp.max <= 17,8 => úloha se vejde do Little => NIKDY nesáhne na Big/Prime
#    uclamp.max <= 70,8 => úloha se vejde do Big    => NIKDY nesáhne na Prime (X3)
# Frekvence na Big (max 2367 MHz): 25 -> ~836, 35 -> ~1170, 50 -> ~1672 MHz.
# Buzení Big/Prime kvůli sync adaptéru je přesně ta noční spotřeba, kterou
# tenhle profil odstraňuje — a jediná hodnota, která to skutečně zaručí,
# je <= 17.
# =============================================================================

PROFILE_NAME="night"
PROFILE_DESC="Noc — pozadí drženo mimo velká jádra, GPU srazená, nabíjení do 80 %"

# --- uclamp ------------------------------------------------------------------

# Žádné podlahy — v nočním profilu je jakýkoli boost čistá ztráta.
UCLAMP_TOPAPP_MIN=""
UCLAMP_FG_MIN=""
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# 50 => util 512 => ~1672 MHz na Big; 50 < 70,8 => Prime (X3) se neprobudí.
# Je to pojistka pro případ, že uživatel telefon vezme do ruky DŘÍV, než
# automat přepne profil. ~1672 MHz na Big je pořád vysoko nad naměřeným
# ustáleným stavem (Big 910 MHz), takže odemčení a pár doteků NEBUDE působit
# rozbitě; ubírá se jen špička a nejdražší jádro.
UCLAMP_TOPAPP_MAX="50"

# 35 => util 358 => ~1170 MHz na Big; Prime vyloučen.
# Viditelné-ale-neaktivní procesy při zhasnutém displeji reálně nic
# neobsluhují, takže ~1170 MHz je bohatě dost.
UCLAMP_FG_MAX="35"

# 17 => util 174. HLAVNÍ PÁKA TOHOTO PROFILU a jediná hodnota, která splní
# zadání "minimální výkon na pozadí" doslova: 17 je POD prahem 17,8, takže
# se background úloha vejde do kapacity Little (182) a scheduler ji NIKDY
# nemusí přesunout na Big ani Prime. Sync, JobScheduler a údržba tedy v noci
# fyzicky neprobudí velká jádra.
# Cena je záměrně malá: uvnitř Little to odpovídá ~1629 MHz ze 1704 MHz
# (174/182 x 1704), tj. Little běží prakticky na plné frekvenci — omezuje se
# UMÍSTĚNÍ, ne takt. Proto je to tady levnější kompromis než v denním profilu.
# VÝHRADA: že je to celkově úspornější, NENÍ změřeno — proti stojí race-to-idle
# (na Little poběží úloha déle) a energy model v debugfs není dostupný, takže
# to změřit nelze. Volím to, protože v noci na době doběhu nezáleží.
# (V powersave je proto ponecháno volnějších 30 = ~1002 MHz na Big.)
UCLAMP_BG_MAX="17"

# 35 => util 358 => ~1170 MHz na Big. Systémové služby dostávají výrazně víc
# než obyčejné pozadí, a hlavně SMÍ na Big — protože přes ně jdou wakeupy,
# notifikace a probuzení displeje. Zahnat i je pod 17,8 na Little by riskovalo
# pomalé probuzení telefonu, což je cena, kterou v noci platit nechci.
UCLAMP_SYSBG_MAX="35"

# --- GPU ---------------------------------------------------------------------

# 419000 = 9. krok shora ze seznamu (890/850/807/723/649/580/521/467/419),
# tj. ~47 % stock maxima. Páka je bezpečná a ověřená: SPEC potvrzuje, že
# zápis do mali `scaling_max_freq` DRŽÍ (649000 bylo po 12 s stále 649000),
# na rozdíl od cooling_device24, který HAL přepisuje každých ~7 s.
# Při zhasnutém displeji nic nerenderuje, takže strop se prakticky nedotkne
# ničeho; brání ale tomu, aby náhodné probuzení (widget, notifikace, AOD)
# vytáhlo GPU na nejvyšší OPP.
# Proč ne ještě níž (302000/150000): stejný důvod jako u UCLAMP_TOPAPP_MAX —
# uživatel může telefon zvednout dřív, než se profil přepne, a odemykací
# animace při 300 MHz už by byla znát. 419000 je kompromis, ne měření.
GPU_MAX_FREQ="419000"

# scaling_min_freq je stock na nejnižším kroku (150000) — není kam níž.
GPU_MIN_FREQ=""

# power_policy: `coarse_demand` by teoreticky GPU mezi úlohami víc uspával,
# ALE SPEC neobsahuje ŽÁDNÉ měření spotřeby jednotlivých policy. Nehádám,
# i když by to sem tematicky sedělo. (OTEVŘENÁ OTÁZKA — dá se změřit.)
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# Prázdné = default. Profil `game` znamená MÉNĚ throttlingu, tj. přesný opak
# záměru. Zároveň se tím nepleteme systému, který si prop nastavuje sám.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# NESAHÁM. V noci by se nabízelo zvýšit swappiness "ať se pozadí odswapuje",
# jenže SPEC pro to nedává žádné měření a odswapované procesy se stejně budou
# probouzet a swapovat zpátky. zram na HW akcelerátoru (`lz77eh`, Emerald Hill,
# ~0 CPU a ~0 tepla dle SPEC) nechávám zcela na pokoji, včetně velikosti
# a algoritmu — a zram se dle zadání v profilech neřeší vůbec.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# SPEC neuvádí stock readahead ani I/O měření => nenastavuji.
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
# 80 %. Jediný profil, kde to nastavuji, a to ze tří naměřených důvodů:
#  1) baterie má 602 cyklů (SPEC) — už není nová, degradaci má smysl brzdit;
#  2) `charge_stop_level` je 0660 system:system, ale root do něj ZAPSAT MŮŽE —
#     ověřeno přímo zápisem hodnoty 80 a návratem na 100 (SPEC);
#  3) noc je jediná situace, kdy je telefon předvídatelně dlouhé hodiny
#     na nabíječce s plnou baterií, což je právě stav, který kapacitu ničí.
# `charge_start_level` nesahám (stock 0) — SPEC neuvádí měření hystereze,
# takže nechávám systému, kdy dobíjení znovu spustí.
# Reverzibilní: `pxtune charge off` nebo `pxtune revert`.
CHARGE_STOP_LEVEL="80"
