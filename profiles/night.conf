# =============================================================================
# pixel_tune profile: night  (the phone is lying on the desk)
# Pixel 8a / Tensor G3 "zuma" — values derived EXCLUSIVELY from SPEC.md
# =============================================================================
#
# INTENT: minimal background performance, maximum saving. Nobody is looking.
#
# STRATEGY: in this profile the background is the ONLY meaningful target. With
# the screen off, the top-app group is either empty or holds the last used app
# that is not drawing anything. The centre of gravity therefore lies on
# background / system-background, unlike in the other profiles.
#
# Calibration against MEASURED cpu_capacity (Little 182 / Big 725 /
# Prime 1024; the 0-100 % uclamp scale is relative to 1024) — see
# powersave.conf for details:
#    uclamp.max <= 17.8 => the task fits on Little => NEVER touches Big/Prime
#    uclamp.max <= 70.8 => the task fits on Big    => NEVER touches Prime (X3)
# Frequencies on Big (max 2367 MHz): 25 -> ~836, 35 -> ~1170, 50 -> ~1672 MHz.
# Waking Big/Prime for a sync adapter is exactly the night-time drain this
# profile removes. NOTE: the /dev/cpuctl/background route DOES NOT WORK —
# the vendor groups/bg/uclamp_max ships at 130 (below the Little threshold of
# 17.8 %) and the stricter of the two applies, so anything written there is a
# no-op (see the deleted UCLAMP_BG_MAX below). The real lever is the vendor
# node VS_BG_UCLAMP_MAX (v2 below): there are no LAUNCH hints at night, so it
# can safely be pushed below 130.
# =============================================================================

PROFILE_NAME="night"
PROFILE_DESC="Night — background kept off the big cores, GPU cut down, charge to 80 %"

# --- uclamp ------------------------------------------------------------------

# No floors — in a night profile any boost is a pure loss.
UCLAMP_TOPAPP_MIN=""
UCLAMP_FG_MIN=""
UCLAMP_BG_MIN=""
UCLAMP_SYSBG_MIN=""

# 50 => util 512 => ~1672 MHz on Big; 50 < 70.8 => Prime (X3) will not wake.
# This is insurance for the case where the user picks the phone up BEFORE the
# daemon switches profiles. ~1672 MHz on Big is still far above the measured
# steady state (Big 910 MHz), so unlocking and a few taps will NOT feel
# broken; only the peak and the most expensive core are taken away.
UCLAMP_TOPAPP_MAX="50"

# 35 => util 358 => ~1170 MHz on Big; Prime excluded.
# Visible-but-inactive processes are not really serving anything with the
# screen off, so ~1170 MHz is plenty.
UCLAMP_FG_MAX="35"

# background: UCLAMP_BG_MAX (via /dev/cpuctl/background) is a NO-OP and was
# therefore DELETED. It used to hold 17, described as "THE MAIN LEVER" — but
# research A1 showed that to be wrong: the vendor groups/bg/uclamp_max ships
# at 130 (12.7 %), ALREADY below the Little threshold (17.8 %). uclamp from
# /dev/cpuctl and from the vendor interface are aggregated and the STRICTER of
# the two applies, so 17 (=174), or anything >130 in cpuctl/background, has no
# effect — the vendor keeps the background off the big cores by itself. The
# real night-time lever is VS_BG_UCLAMP_MAX in the v2 section below (it can go
# under 130, because there are no LAUNCH hints at night).

# 35 => util 358 => ~1170 MHz on Big. System services get considerably more
# than ordinary background work, and crucially they ARE ALLOWED on Big —
# because wakeups, notifications and display wake go through them. Pushing
# them below 17.8 onto Little as well would risk a slow phone wake, a price I
# do not want to pay at night.
UCLAMP_SYSBG_MAX="35"

# --- GPU ---------------------------------------------------------------------

# 419000 = the 9th step from the top of the list
# (890/850/807/723/649/580/521/467/419), i.e. ~47 % of the stock maximum. The
# lever is safe and verified: the SPEC confirms that a write to the mali
# `scaling_max_freq` STICKS (649000 was still 649000 after 12 s), unlike
# cooling_device24, which the HAL rewrites roughly every 7 s.
# With the screen off nothing is rendering, so the cap barely touches
# anything; but it does prevent a random wakeup (widget, notification, AOD)
# from pulling the GPU to its highest OPP.
# Why not lower still (302000/150000): the same reason as for
# UCLAMP_TOPAPP_MAX — the user may pick the phone up before the profile
# switches, and the unlock animation at 300 MHz would already be noticeable.
# 419000 is a compromise, not a measurement.
GPU_MAX_FREQ="419000"

# scaling_min_freq is at its lowest step at stock (150000) — nowhere lower.
GPU_MIN_FREQ=""

# power_policy: `coarse_demand` would in theory power the GPU down more
# between jobs, BUT the SPEC contains NO power measurement of the individual
# policies. I am not guessing, even though it would fit the theme here.
# (OPEN QUESTION — this can be measured.)
GPU_POWER_POLICY=""

# --- thermal HAL profile -----------------------------------------------------
# Empty = default. The `game` profile means LESS throttling, i.e. the exact
# opposite of the intent. It also keeps us out of the way of the system, which
# sets the prop by itself.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# HANDS OFF. At night it would be tempting to raise swappiness "so the
# background gets swapped out", except the SPEC offers no measurement for it
# and swapped-out processes will wake up and swap back in anyway. zram on the
# hardware accelerator (`lz77eh`, Emerald Hill, ~0 CPU and ~0 heat per the
# SPEC) is left completely alone, including its size and algorithm — and per
# the brief, zram is not handled in profiles at all.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# The SPEC lists neither a stock readahead nor any I/O measurement => not set.
IO_READAHEAD_KB=""

# --- charging ----------------------------------------------------------------
# 80 %. The only profile where I set this, for three measured reasons:
#  1) the battery has 602 cycles (SPEC) — it is no longer new, so slowing the
#     degradation is worthwhile;
#  2) `charge_stop_level` is 0660 system:system, but root CAN write to it —
#     verified by writing 80 and returning to 100 (SPEC);
#  3) night is the only situation where the phone is predictably on the
#     charger for hours with a full battery, which is precisely the state that
#     destroys capacity.
# `charge_start_level` is left alone (stock 0) — the SPEC gives no hysteresis
# measurement, so I leave it to the system to decide when to resume charging.
# Reversible: `pxtune charge off` or `pxtune revert`.
CHARGE_STOP_LEVEL="80"

# =============================================================================
# CONTRACT v2 — new levers (empty = do not touch). Stock values in the
# comments are REAL, verified by the probe on 2026-08-07. At night the biggest
# gain is in idle power, which the v1 levers cannot reach — hence the vendor
# nodes are used here for the first time.
# =============================================================================

# --- vendor_sched (/proc/vendor_sched, scale 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min       stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min       stock 0
# 100 < stock 130 => a REAL tightening of the background (what UCLAMP_BG_MAX
# could not do). Safe only at night: the node is owned by the power HAL, which
# raises it to 512 on LAUNCH, but with the screen off no LAUNCH hints arrive.
# No reapply thread needed.
VS_BG_UCLAMP_MAX="100"      # groups/bg/uclamp_max       stock 130
VS_TA_PREFER_IDLE=""        # groups/ta/prefer_idle      stock false
# 1024 = no frequency overshoot (stock 1100 = +7.4 %). At night, pure saving.
VS_DVFS_HEADROOM="1024"     # dvfs_headroom              stock 1100

# --- sched_pixel governor ---
# CHANGE 2026-08-08: night is the ONLY profile in which limit_frequency is a
# reliable lever. The node is owned by the power HAL, which raises it on the
# LAUNCH hint — but with the screen off no apps are being started, so no
# LAUNCH hints arrive (the same reasoning that VS_BG_UCLAMP_MAX=100 above
# rests on).
#
# The caps are set EXACTLY at the measured steady level the phone settles at
# under sustained load anyway (SPEC: Big 910 MHz, Prime 1164 MHz). Night-time
# work — sync, indexing, backups, dexopt — thus gets exactly as much clock as
# the HAL would leave it under load during the day, but must not take the peak
# it would then crawl back down from over ~84 s at MaxReleaseStep=1.
#
# Both values are VALID OPPs from the SPEC tables (policy4 contains 910000,
# policy8 contains 1164000) — the kernel will therefore not snap them
# elsewhere.
#
# Little deliberately WITHOUT a cap: it is the busiest cluster, and when it
# cannot keep up the scheduler moves the work to Big, where it costs more
# energy. Tightening Little would be more likely to raise power draw (the same
# reasoning as in powersave).
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency    stock 1328000
SCHED_LIMIT_FREQ_MID="910000"   # policy4 limit_frequency  stock 1836000
SCHED_LIMIT_FREQ_BIG="1164000"  # policy8 limit_frequency  stock 2363000
SCHED_DOWN_RATE_MID=""      # policy4 down_rate_limit_us  stock 500  (probe; NOT 20000)
SCHED_DOWN_RATE_BIG=""      # policy8 down_rate_limit_us  stock 500  (probe; NOT 20000)

# --- devfreq ---
DEVFREQ_MIF_TARGET_LOAD=""  # mif interactive/target_load stock "20 40" (probe)
DEVFREQ_DSU_MIN=""          # dsu min_freq               stock 324000 (probe)
DEVFREQ_MIF_MIN=""          # mif min_freq               stock 421000 (probe)

# --- idle residency ---
# ⚠ DELIBERATELY EMPTY — DO NOT ADD. The research proposed
# CPUPM_CL1/CL2_RESIDENCY=100000 (so the cluster powers down sooner), BUT the
# probe on 2026-08-07 showed the REAL stock is 10000 (10 ms). Idle residency
# is therefore already 10 ms out of the box; writing 100000 would power the
# cluster down LATER = the exact opposite of the intended saving. There is no
# point touching it.
CPUPM_CL1_RESIDENCY=""      # cpd_cl1_target_residency   REAL stock 10000 (probe; NOT 750000)
CPUPM_CL2_RESIDENCY=""      # cpd_cl2_target_residency   REAL stock 10000 (probe; NOT 750000)

# --- GPU ---
# 20 ms = the more economical GPU frequency re-evaluation period. At night
# nothing is rendering.
GPU_DVFS_PERIOD="20"        # mali dvfs_period  10|20 ms  stock 20 (probe)

# --- memory ---
# DELIBERATELY EMPTY, unlike balanced/performance/game/pogo, where it is 1000.
# min_ttl_ms protects recently used pages from being pushed into zram — useful
# when you are switching between apps. At night the opposite is true: you want
# the working set to be FREELY evicted to zram, freeing RAM for the night-time
# jobs (sync, indexing, dexopt) and leaving kswapd in peace. Protection would
# only get in the way of the cleanup here. Empty = stock 0 stays.
MEM_LRU_MIN_TTL=""          # /sys/kernel/mm/lru_gen/min_ttl_ms  stock 0 (probe)

# --- thermal, STRICTLY GUARDED ---
THERMAL_CDEV_BYPASS=""      # 0|1 — runtime skin-throttling kill switch; no place in night
THERMAL_PROFILE_MAX_SKIN="" # °C — night deploys no THERMAL_PROFILE_* at all
