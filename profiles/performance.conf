# =============================================================================
# pixel_tune profile: performance  ("a better, snappier balanced")
# Pixel 8a / Tensor G3 "zuma" — values derived EXCLUSIVELY from SPEC.md
# =============================================================================
#
# INTENT (the user's own words): "it should be fast, but not run flat out —
# more of a better, snappier balanced." => the goal is RESPONSIVENESS, not a
# higher ceiling.
#
# WHY THIS PROFILE DOES NOT RAISE ANY CEILINGS (and could not anyway):
#  - `scaling_max_freq` is 0444, not writable even as root (SPEC).
#  - cooling devices are rewritten by the thermal HAL roughly every 7 s (SPEC)
#    => unusable.
#  - stock uclamp.max is already "max" (SPEC) => there is nowhere above stock.
#  The only route "up" would be the `game` thermal profile, but that one is
#  UNVERIFIED and means more heat — it has no place in a profile meant to be a
#  "better balanced" (see the thermal section below).
#
# WHY uclamp.min IS THE RIGHT LEVER HERE:
#  Stock is min=0 (SPEC) => the `sched_pixel` governor must first "see" the
#  utilisation before it raises the frequency. That is the source of the small
#  lag on touch, not a lack of ceiling. `uclamp.min > 0` = a floor => faster
#  frequency ramp-up (SPEC, uclamp section).
#
# FLOOR CALIBRATION (the key number):
#  Measured under sustained load (SPEC): Big 910 MHz = 38 % of HW, Prime
#  1164 MHz = 40 % of HW, at 58 °C junction / 40.5 °C skin. I therefore pick
#  the floor BELOW that line (25 < 38). Consequence: the floor never fights
#  the thermal HAL and never raises SUSTAINED power draw or temperature — it
#  only removes the ramp-up delay on short interactive spikes. That is exactly
#  "snappier, not more powerful".
#  Had I set min=40+, the profile would push against the throttling loop, and
#  given the measured recovery (MaxReleaseStep=1 => ~84 s) the result would be
#  a PERMANENTLY throttled phone, i.e. slower, not faster.
#
# Note: /proc/sys/kernel/sched_util_clamp_min stays at stock 1024 — DO NOT
# TOUCH (the SPEC explicitly forbids it; otherwise the uclamp boost would be
# killed for Google's power-service.pixel-libperfmgr as well).
# =============================================================================

PROFILE_NAME="performance"
PROFILE_DESC="Snappier balanced — faster ramp-up, ceilings unchanged"

# --- uclamp ------------------------------------------------------------------

# 25 => util 256 (the 0-100 scale is relative to the Prime capacity of 1024).
# What that physically means given the measured cpu_capacity values
# (Little 182 / Big 725 / Prime 1024):
#   - 256 > 182 => top-app does NOT fit on Little => the scheduler places it
#     on Big. That is precisely the "snappiness" being sought: the foreground
#     starts on a big core instead of waiting for utilisation on Little to
#     push it up there.
#   - on Big this corresponds to a floor of ~836 MHz (256/725 x 2367).
#   - 25 << 70.8 => the floor NEVER forces a Prime (X3) wakeup by itself,
#     i.e. never wakes the most expensive core. That is exactly why the
#     profile is "snappier", not "more powerful".
#   - 25 % is also safely below the measured steady state (Big 38 %,
#     Prime 40 %) => it does not fight the thermal HAL and does not raise
#     sustained power draw.
# If the profile turns out to be too thirsty, the only sensible alternative is
# to go BELOW 17.8 (e.g. 15 => a floor of ~1404 MHz inside Little with no
# migration to Big); that is a different design though, and I am not
# pre-empting it without measurements.
UCLAMP_TOPAPP_MIN="25"

# Caps stay at stock ("max"). There is nowhere up (see the header).
UCLAMP_TOPAPP_MAX=""

# I do NOT set a foreground floor: the `foreground` group holds visible but
# inactive processes and bound services. The SPEC contains no measurement of
# what actually sits in it on this device, so a blanket boost would be
# guesswork with power draw as the price. Conservatively empty instead.
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""

# background/system-background: the profile should speed up what the user is
# looking at. Boosting the background = extra power draw and nothing else.
# Capping it, on the other hand, is not this profile's job (powersave/night
# are for that). => hands off.
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""
UCLAMP_SYSBG_MIN=""
UCLAMP_SYSBG_MAX=""

# --- GPU ---------------------------------------------------------------------
# Stock scaling_max_freq = 890000 = the highest available step => nowhere up.
# I could raise scaling_min_freq for a faster GPU ramp, but the SPEC contains
# NO GPU measurements at all (no utilisation, no ramp latency, no temperature
# under GPU load) => I am not guessing. Same for power_policy.
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profile -----------------------------------------------------
# DELIBERATELY EMPTY. The `game` profile has "Disabled": true on the CPU cdev
# bindings, i.e. LESS throttling (SPEC) — except:
#   1) it is an UNVERIFIED mechanism (SPEC: "NOT YET VERIFIED that it actually
#      works"),
#   2) it raises the ceiling and the heat, which is exactly what this profile
#      is NOT supposed to do ("it should not run flat out"),
#   3) the system sets the prop by itself (during the probe it was on
#      "camera") => writing it from a profile that runs all the time risks
#      cutting across the camera's own control.
# Relaxing the throttling is reserved for the `game` profile, where it is on
# only temporarily. Anyone wanting to try it here should switch to "game" ONLY
# AFTER verifying it on the device.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# HANDS OFF. zram compresses on the Emerald Hill hardware accelerator
# (`lz77eh`, ~0 CPU, ~0 heat per the SPEC), page-cluster=0 is already optimal
# per the SPEC, and for the remaining values the SPEC offers no measurement
# showing a problem. Tuning swappiness "for performance" would be placebo.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# The SPEC lists neither a stock readahead nor any I/O measurement => not set.
IO_READAHEAD_KB=""

# --- charging ----------------------------------------------------------------
CHARGE_STOP_LEVEL=""

# =============================================================================
# CONTRACT v2 — new levers (empty = do not touch). Stock values in the
# comments are REAL, verified by the probe on 2026-08-07. The profile's intent
# is RESPONSIVENESS, not a ceiling — the v2 keys therefore shorten the ramp
# closer to the root than uclamp.min does, but NONE of them raises a ceiling
# (there is no way to).
# =============================================================================

# --- vendor_sched (/proc/vendor_sched, scale 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min       stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min       stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max       stock 130
# 1 = the scheduler looks for an idle core instead of packing tasks => faster
# ramp-up. The same thing the power HAL does on LAUNCH; here permanently, for
# the interactive feel.
VS_TA_PREFER_IDLE="1"       # groups/ta/prefer_idle      stock false
# 1280 = the headroom the power HAL sets for itself on LAUNCH (the governor
# picks a frequency with more margin => faster reaction to a load spike).
# Stock 1100.
VS_DVFS_HEADROOM="1280"     # dvfs_headroom              stock 1100

# --- sched_pixel governor ---
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency    stock 1328000
SCHED_LIMIT_FREQ_MID=""     # policy4 limit_frequency    stock 1836000
SCHED_LIMIT_FREQ_BIG=""     # policy8 limit_frequency    stock 2363000
# 3000 = the frequency does not fall as quickly between touches => smoother
# response to intermittent input (scrolling, typing). Stock 500 (probe). 3 ms
# is still below the frame budget (8.3 ms at 120 Hz), so it is not held across
# a whole frame.
#
# CHANGE 2026-08-08: set on BOTH clusters, not just policy8. Given the measured
# capacities (Little 182 / Big 725), interactive work mostly lands on
# Big/A715 = policy4; letting it drop fast there while holding it up only on
# Prime was inconsistent. `balanced` has the same pair after the v2.1
# revision.
SCHED_DOWN_RATE_MID="3000"  # policy4 down_rate_limit_us  stock 500  (probe; NOT 20000)
SCHED_DOWN_RATE_BIG="3000"  # policy8 down_rate_limit_us  stock 500  (probe; NOT 20000)

# --- devfreq ---
DEVFREQ_MIF_TARGET_LOAD=""  # mif interactive/target_load stock "20 40" (probe)
DEVFREQ_DSU_MIN=""          # dsu min_freq               stock 324000 (probe)
DEVFREQ_MIF_MIN=""          # mif min_freq               stock 421000 (probe)

# --- idle residency ---
CPUPM_CL1_RESIDENCY=""      # cpd_cl1_target_residency   REAL stock 10000 (probe; NOT 750000)
CPUPM_CL2_RESIDENCY=""      # cpd_cl2_target_residency   REAL stock 10000 (probe; NOT 750000)

# --- GPU ---
GPU_DVFS_PERIOD=""          # mali dvfs_period  10|20 ms  stock 20 (probe)

# --- memory ---
# 1000 ms of working-set protection. The same value and the same reasoning as
# in `balanced`: the profile is meant to feel snappy, and the longest source
# of waiting when switching to an already running app is not the CPU clock
# (the LAUNCH hint handles that by itself) but pulling its pages back out of
# zram. The one item in the profile that both improves smoothness AND removes
# work (fewer refaults = less decompression and less kswapd). Stock 0 = no
# protection.
MEM_LRU_MIN_TTL="1000"      # /sys/kernel/mm/lru_gen/min_ttl_ms  stock 0 (probe)

# --- thermal, STRICTLY GUARDED ---
THERMAL_CDEV_BYPASS=""      # 0|1 — runtime skin-throttling kill switch; never from a profile without a safety net
THERMAL_PROFILE_MAX_SKIN="" # °C — performance deploys no THERMAL_PROFILE_* at all
