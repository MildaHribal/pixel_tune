# =============================================================================
# pixel_tune profil: performance  ("lepší a svižnější balanced")
# Pixel 8a / Tensor G3 "zuma" — hodnoty odvozené VÝHRADNĚ ze SPEC.md
# =============================================================================
#
# ZÁMĚR (doslova od uživatele): "bude výkonný, ale nepojede na maximum, bude to
# spíše takový lepší a svižnější balanced." => cílem je ODEZVA, ne strop.
#
# PROČ TENHLE PROFIL NEZVYŠUJE STROPY (a ani nemůže):
#  - `scaling_max_freq` je 0444, nezapisovatelné ani jako root (SPEC).
#  - cooling devices přepisuje thermal HAL ~každých 7 s (SPEC) => nepoužitelné.
#  - stock uclamp.max je už "max" (SPEC) => nad stock není kam jít.
#  Jediná cesta "nahoru" by byl thermal profil `game`, ale ten je NEOVĚŘENÝ
#  a znamená víc tepla — do profilu, který má být "lepší balanced", nepatří
#  (viz sekce thermal níže).
#
# PROČ MÁ SMYSL PRÁVĚ uclamp.min:
#  Stock je min=0 (SPEC) => governor `sched_pixel` musí utilizaci nejdřív
#  "vidět", než zvedne frekvenci. To je zdroj drobného laggu při doteku, ne
#  nedostatek stropu. `uclamp.min > 0` = podlaha => rychlejší náběh frekvence
#  (SPEC, sekce uclamp).
#
# KALIBRACE PODLAHY (klíčové číslo):
#  Naměřeno pod trvalou zátěží (SPEC): Big 910 MHz = 38 % HW, Prime 1164 MHz
#  = 40 % HW, při junction 58 °C / skin 40,5 °C. Podlahu proto volím POD touto
#  hranicí (25 < 38). Důsledek: podlaha nikdy nebojuje s thermal HAL, nikdy
#  nezvyšuje TRVALOU spotřebu ani teplotu — jen odstraňuje prodlevu náběhu
#  u krátkých interaktivních špiček. To je přesně "svižnější, ne výkonnější".
#  Kdybych dal min=40+, profil by tlačil proti škrticí smyčce a s ohledem na
#  naměřené zotavení (MaxReleaseStep=1 => ~84 s) by výsledkem byl TRVALE
#  škrcený telefon, tedy pomalejší, ne rychlejší.
#
# Pozn.: /proc/sys/kernel/sched_util_clamp_min zůstává na stock 1024 — NESAHÁ SE
# (SPEC to výslovně zakazuje, jinak by se zabil uclamp boost i Googlímu
# power-service.pixel-libperfmgr).
# =============================================================================

PROFILE_NAME="performance"
PROFILE_DESC="Svižnější balanced — rychlejší náběh, stropy beze změny"

# --- uclamp ------------------------------------------------------------------

# 25 => util 256 (škála 0-100 je relativní k capacity Prime = 1024).
# Co to podle naměřených cpu_capacity (Little 182 / Big 725 / Prime 1024)
# fyzicky znamená:
#   - 256 > 182 => top-app se NEVEJDE do Little => scheduler ho umístí na Big.
#     To je právě ta hledaná "svižnost": popředí startuje na velkém jádře
#     místo toho, aby čekalo, až ho utilizace na Little vytlačí výš.
#   - na Big to odpovídá podlaze ~836 MHz (256/725 x 2367).
#   - 25 << 70,8 => podlaha NIKDY sama nevynutí probuzení Prime (X3),
#     tedy nejdražšího jádra. Přesně proto je profil "svižnější", ne "výkonnější".
#   - 25 % je zároveň bezpečně pod naměřeným ustáleným stavem (Big 38 %,
#     Prime 40 %) => nebojuje s thermal HAL a nezvyšuje ustálenou spotřebu.
# Kdyby se profil ukázal jako příliš žravý, jediná smysluplná alternativa je
# jít POD 17,8 (např. 15 => podlaha ~1404 MHz uvnitř Little bez migrace na Big);
# to je ale jiný design a bez měření to nepředjímám.
UCLAMP_TOPAPP_MIN="25"

# Stropy zůstávají stock ("max"). Nahoru není kam (viz hlavička).
UCLAMP_TOPAPP_MAX=""

# foreground podlahu NENASTAVUJI: skupina `foreground` obsahuje viditelné,
# ale ne aktivní procesy a vázané služby. SPEC neobsahuje žádné měření toho,
# co v ní na tomhle zařízení reálně sedí, takže by paušální boost byl hádání
# se spotřebou jako cenou. Radši konzervativně prázdné.
UCLAMP_FG_MIN=""
UCLAMP_FG_MAX=""

# background/system-background: profil má zrychlovat to, na co se uživatel dívá.
# Boostovat pozadí = jen spotřeba navíc. Stropovat je zase není účel tohoto
# profilu (od toho je powersave/night). => nesahat.
UCLAMP_BG_MIN=""
UCLAMP_BG_MAX=""
UCLAMP_SYSBG_MIN=""
UCLAMP_SYSBG_MAX=""

# --- GPU ---------------------------------------------------------------------
# Stock scaling_max_freq = 890000 = nejvyšší dostupný krok => nahoru není kam.
# scaling_min_freq bych mohl zvednout kvůli rychlejšímu náběhu GPU, ale SPEC
# neobsahuje ŽÁDNÉ měření GPU (ani utilizaci, ani ramp latency, ani teplotu
# pod GPU zátěží) => nehádám. Stejně tak power_policy.
GPU_MAX_FREQ=""
GPU_MIN_FREQ=""
GPU_POWER_POLICY=""

# --- thermal HAL profil ------------------------------------------------------
# ZÁMĚRNĚ PRÁZDNÉ. Profil `game` má CPU cdev vazby "Disabled": true, tj. MÉNĚ
# throttlingu (SPEC) — jenže:
#   1) je to NEOVĚŘENÝ mechanismus (SPEC: "Zatím NEOVĚŘENO že to reálně funguje"),
#   2) je to zvýšení stropu / tepla, což je přesně to, co tenhle profil NEMÁ
#      dělat ("nepojede na maximum"),
#   3) systém si prop nastavuje sám (při probu byl na "camera") => psát ho
#      v profilu, který běží pořád, znamená riziko, že skočíme do řízení kameře.
# Uvolnění škrcení je vyhrazeno profilu `game`, kde je zapnuté jen dočasně.
# Kdo to chce vyzkoušet i tady, přepíše na "game" AŽ PO ověření na zařízení.
THERMAL_PROFILE_CPU_MID=""
THERMAL_PROFILE_CPU_HIGH=""

# --- vm ----------------------------------------------------------------------
# NESAHÁM. zram komprimuje HW akcelerátorem Emerald Hill (`lz77eh`, ~0 CPU,
# ~0 tepla dle SPEC), page-cluster=0 je dle SPEC už optimální a pro ostatní
# hodnoty SPEC nenabízí žádné měření, které by ukazovalo problém. Ladit
# swappiness "na výkon" by bylo placebo.
VM_SWAPPINESS=""
VM_DIRTY_RATIO=""
VM_DIRTY_BG_RATIO=""
VM_VFS_CACHE_PRESSURE=""

# --- I/O ---------------------------------------------------------------------
# SPEC neuvádí stock readahead ani I/O měření => nenastavuji.
IO_READAHEAD_KB=""

# --- nabíjení ----------------------------------------------------------------
CHARGE_STOP_LEVEL=""

# =============================================================================
# KONTRAKT v2 — nové páky (prázdné = nesahat). Stock v komentářích = SKUTEČNÝ,
# ověřený probem 2026-08-07. Záměr profilu je ODEZVA, ne strop — v2 klíče proto
# zkracují náběh blíž kořeni než uclamp.min, ale ŽÁDNÝ nezvedá strop (nemá jak).
# =============================================================================

# --- vendor_sched (/proc/vendor_sched, škála 0-1024) ---
VS_TA_UCLAMP_MIN=""         # groups/ta/uclamp_min       stock 1
VS_FG_UCLAMP_MIN=""         # groups/fg/uclamp_min       stock 0
VS_BG_UCLAMP_MAX=""         # groups/bg/uclamp_max       stock 130
# 1 = plánovač hledá volné jádro místo pakování úloh => svižnější náběh.
# To, co power HAL sám dělá při LAUNCH; tady natrvalo pro interaktivní pocit.
VS_TA_PREFER_IDLE="1"       # groups/ta/prefer_idle      stock false
# 1280 = headroom, který si power HAL sám nastavuje při LAUNCH (governor volí
# frekvenci s větší rezervou => rychlejší reakce na skok zátěže). Stock 1100.
VS_DVFS_HEADROOM="1280"     # dvfs_headroom              stock 1100

# --- sched_pixel governor ---
SCHED_LIMIT_FREQ_LITTLE=""  # policy0 limit_frequency    stock 1328000
SCHED_LIMIT_FREQ_MID=""     # policy4 limit_frequency    stock 1836000
SCHED_LIMIT_FREQ_BIG=""     # policy8 limit_frequency    stock 2363000
# 3000 = frekvence neklesá tak rychle mezi doteky => plynulejší odezva při
# přerušovaném vstupu (scroll, psaní). Stock 500 (probe). 3 ms je pořád pod
# rozpočtem snímku (8,3 ms při 120 Hz), takže se to nedrží přes celý snímek.
#
# ZMĚNA 2026-08-08: nastaveno na OBOU clusterech, ne jen na policy8. Interaktivní
# práce sedí podle měřených capacity (Little 182 / Big 725) hlavně na Big/A715 =
# policy4; pustit ji rychle spadnout tam a držet ji nahoře jen na Prime bylo
# nekonzistentní. Stejnou dvojici má i `balanced` po revizi v2.1.
SCHED_DOWN_RATE_MID="3000"  # policy4 down_rate_limit_us  stock 500  (probe; NE 20000)
SCHED_DOWN_RATE_BIG="3000"  # policy8 down_rate_limit_us  stock 500  (probe; NE 20000)

# --- devfreq ---
DEVFREQ_MIF_TARGET_LOAD=""  # mif interactive/target_load stock "20 40" (probe)
DEVFREQ_DSU_MIN=""          # dsu min_freq               stock 324000 (probe)
DEVFREQ_MIF_MIN=""          # mif min_freq               stock 421000 (probe)

# --- idle residency ---
CPUPM_CL1_RESIDENCY=""      # cpd_cl1_target_residency   SKUTEČNÝ stock 10000 (probe; NE 750000)
CPUPM_CL2_RESIDENCY=""      # cpd_cl2_target_residency   SKUTEČNÝ stock 10000 (probe; NE 750000)

# --- GPU ---
GPU_DVFS_PERIOD=""          # mali dvfs_period  10|20 ms  stock 20 (probe)

# --- paměť ---
# 1000 ms ochrany pracovní množiny. Stejná hodnota a stejný důvod jako v
# `balanced`: profil má být svižný, a nejdelší zdroj čekání při přepnutí do už
# běžící aplikace není takt procesoru (ten řeší LAUNCH hint sám), ale dotažení
# jejích stránek zpátky ze zramu. Jediná položka profilu, která zároveň zvyšuje
# plynulost A ubírá práci (méně refaultů = méně dekomprese a méně kswapd).
# Stock 0 = žádná ochrana.
MEM_LRU_MIN_TTL="1000"      # /sys/kernel/mm/lru_gen/min_ttl_ms  stock 0 (probe)

# --- thermal, TVRDĚ HLÍDANÉ ---
THERMAL_CDEV_BYPASS=""      # 0|1 — runtime vypínač skin-throttlingu; nikdy z profilu bez pojistky
THERMAL_PROFILE_MAX_SKIN="" # °C — performance nenasazuje žádný THERMAL_PROFILE_*
