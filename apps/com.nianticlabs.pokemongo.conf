# =============================================================================
# pixel_tune - pravidlo pro Pokemon GO
# Pixel 8a / Tensor G3 "zuma" / Android 16
#
# ZADANI: co nejnizsi grafika, omezeny procesor, ale ZACHOVAT 60 Hz a 60 fps.
#
# UVAHA, ZE KTERE VSECHNO PLYNE
# -----------------------------
# PoGO neni narocna hra. Je to DLOUHA hra, ktera bezi hodiny, casto venku,
# casto na primem slunci. Z Googlova thermal_info_config_akita.json vime, ze
# se na tomhle telefonu skrti VYHRADNE podle teploty POVRCHU (VIRTUAL-SKIN),
# ne podle teploty kremiku:
#     VIRTUAL-SKIN-CPU-MID   prahy 39,0 a 41,0 C
#     VIRTUAL-SKIN-CPU-HIGH  prahy 41,0, 43,0 a 52,0 C
#     hystereze 1,9 C, MaxReleaseStep 1 (zotaveni ~84 s)
#
# Namereny strop vlastniho ohrevu pri plne zatezi vsech devíti jader je
# skin 40,5 C. Tedy: pri hrani na slunci prekrocis prah 41 C i BEZ zateze.
# Cilem tohohle pravidla proto NENI vytezit vykon, ale snizit vykon na
# uroven, kterou hra jeste potrebuje, a tim oddalit okamzik, kdy se skin
# dostane na 41 C.
#
# PROC TOHLE PRAVIDLO NEPOUZIVA PROFIL `game`
# -------------------------------------------
# Profil `game` nastavuje vendor.thermal.VIRTUAL-SKIN-CPU-{MID,HIGH}.profile
# na "game", coz podle Googlova konfiguraku ma u vsech tri CPU cooling
# devices "Disabled": true - tedy VYPINA skrceni z tehle dvou senzoru.
# To je spravne pro kratkou narocnou hru, kde chces vytezit tepelnou
# setrvacnost. Pro dvouhodinovou venkovni relaci je to presne naopak:
# chces, aby HAL skrtil DRIV a JEMNEJI, ne pozdeji a tvrdeji.
# Proto ma PoGO vlastni profil `pogo`, ne `game`.
# =============================================================================

APP_PKG="com.nianticlabs.pokemongo"
APP_DESC="Pokemon GO - dlouhé venkovní relace, priorita teploty povrchu"
APP_ENABLED="1"


# =============================================================================
# VRSTVA 1 - Android Game Mode
# =============================================================================
#
# POZOR NA SYNTAXI: `cmd game downscale` je deprecated. Spravne je
#   cmd game set --downscale 0.7 --fps 60 com.nianticlabs.pokemongo
#   cmd game mode 4 com.nianticlabs.pokemongo
# Povolene hodnoty downscale jsou jemnejsi, nez uvadi example.conf.template:
#   0.3 0.35 0.4 0.45 0.5 0.55 0.6 0.65 0.7 0.75 0.8 0.85 0.9 disable
#
# KDYZ MODE 4 NEZABERE, GameManager nebere PoGO jako hru. Zaloha, ktera na
# kategorii aplikace nezavisi (jednorazove, rucne, ne z modulu):
#   device_config put game_overlay com.nianticlabs.pokemongo \
#       'mode=2,downscaleFactor=0.7,fps=60:mode=3,downscaleFactor=0.5,fps=30'
#   cmd game mode 2 com.nianticlabs.pokemongo
# Po kazde zmene rezimu se hra musi RESTARTOVAT.

GAME_MODE="4"

# 60 je strop, ne cil. Hra sama nabizi maximalne 60 a jen tehdy, kdyz je
# v jejim nastaveni zapnuty Native Refresh Rate. Bez toho bezi na 30.
GAME_FPS="60"

# 0.7 = 70 % nativniho rozliseni, tedy zhruba polovicni prace pro GPU.
# Na mape PoGO to neni poznat; jemnejsi kroky jsou k dispozici, kdyby to
# vadilo u textu. Nechodit pod 0.5, tam uz se rozpadaji dialogy.
# Tohle je bezpecna cesta ke "snizeni rozliseni": je per-app, dela to
# SurfaceFlinger a nic se nemusi vracet.
GAME_DOWNSCALE="0.7"

GAME_APPLY="once"


# =============================================================================
# VRSTVA 2 - profil a prebiti jednotlivych klicu
# =============================================================================

# Vlastni profil, ne `game`. Viz uvaha v hlavicce.
APP_PROFILE="pogo"

# --- omezeni procesoru pri zachovani 60 fps ---------------------------------
#
# Kalibrace podle namerenych cpu_capacity (Little 182 / Big 725 / Prime 1024):
#
#   50 => util 512 => ~1672 MHz na Big, a 50 < 70,8 => Prime se NIKDY
#   neprobudi kvuli hre. Prime je nejvetsi jednotlivy zdroj tepla a PoGO
#   ho nepotrebuje - je to Unity hra s jednoduchou scenou, ne benchmark.
#   1672 MHz je porad skoro dvojnasobek ustaleneho stavu (910 MHz), takze
#   se to neprojevi jako zadrhavani.
APP_OVERLAY_UCLAMP_TOPAPP_MAX="50"

#   30 => util 307 => ~1002 MHz podlaha na Big. Render vlakno mezi snimky
#   nespadne na nizke OPP, takze dalsi snimek nezacina z nuly. To je to,
#   co drzi stabilni frame-time pri 60 fps.
#   Podlaha 30 je pod ustalenym stavem 38 %, takze nebojuje s HALem.
APP_OVERLAY_UCLAMP_TOPAPP_MIN="30"

#   Pozadi zamerne NENASTAVUJI. Podle powerhint-akita.json je
#   /proc/vendor_sched/groups/bg/uclamp_max stock 130 z 1024, tedy 12,7 %,
#   coz je uz pod prahem Little (17,8 %). Cokoli, co bych napsal do
#   /dev/cpuctl/background, by bylo volnejsi a tim padem bez ucinku.
#APP_OVERLAY_UCLAMP_BG_MAX=""

# --- GPU --------------------------------------------------------------------
#
# 723000 je treti krok shora (890/850/807/723), tedy ~81 % stock maxima.
# Spolu s downscale 0.7 to znamena, ze GPU ma delat zhruba polovinu prace
# na o petinu nizsi frekvenci - a 60 fps na scene PoGO to porad zvladne.
# Neni to hadani: pri tvem CPU-only zatezovem testu byl cdev_gpu celych
# 150 s na nule, takze GPU ma na tomhle telefonu velkou rezervu.
APP_OVERLAY_GPU_MAX_FREQ="723000"

# 20 ms perioda prepoctu GPU frekvence misto 10. Pri stabilnich 60 fps se
# nema co prepocitavat rychleji; usetri to rezii.
# (Uzel /sys/devices/platform/1f000000.mali/dvfs_period - overit probem.)
APP_OVERLAY_GPU_DVFS_PERIOD="20"

# --- thermal ----------------------------------------------------------------
#
# PRAZDNE, A JE TO ZAMER. Viz hlavicka: u dvouhodinove venkovni relace
# nechces vypinat skin senzory.
APP_OVERLAY_THERMAL_PROFILE_CPU_MID=""
APP_OVERLAY_THERMAL_PROFILE_CPU_HIGH=""

# --- strop taktu ------------------------------------------------------------
#
# JEN KDYZ pxtune-probe potvrdi, ze sched_pixel/limit_frequency je
# zapisovatelne. Do te doby nechat prazdne - hodnoty jsou z Googlova
# powerhintu, ale zapisovatelnost na Androidu 16 overena neni.
# 1557000 je platny OPP jadra Prime a lezi mezi 1298000 a 1745000, ktere
# power HAL sam pouziva.
#APP_OVERLAY_SCHED_LIMIT_FREQ_BIG="1557000"
#APP_OVERLAY_SCHED_LIMIT_FREQ_MID="1418000"


# =============================================================================
# VRSTVA 3 - refresh rate
# =============================================================================
#
# 60/60 = pevnych 60 Hz po dobu hry. Presne podle zadani.
#
# Tohle je jednotliva polozka s NEJVETSIM dopadem na vydrz z celeho souboru:
# panel na 120 Hz stoji energii, kterou PoGO nijak nezhodnoti - hra stejne
# nikdy nevykresli vic nez 60 snimku. Zaroven to snizuje praci
# SurfaceFlingeru, tedy i teplo.
#
# Zapis je GLOBALNI, per-app to funguje jen tak, ze se pri vstupu nastavi
# a pri odchodu vrati. Navrat resi `pxtune app leave`, ktery je volany
# ze sesti nezavislych cest - viz bin/pxtune-perapp.
APP_REFRESH_MIN="60"
APP_REFRESH_PEAK="60"

# Zmena rozliseni ZAKAZANA. GAME_DOWNSCALE vyse dela skoro totez, je
# skutecne per-app a nic se nemusi vracet.
APP_RES=""
APP_RES_ENABLE="0"


# =============================================================================
# ANTI-FLAPPING
# =============================================================================
#
# PoGO se otevira na dlouho, ne na proletnuti. Delsi vstupni prodleva nic
# nestoji a spolehlive odfiltruje splash obrazovku.
APP_MIN_FG_SEC="10"

# Lina lenost pri odchodu je tu obzvlast cenna: pri hrani neustale
# prepinas do map, na fotak nebo do zprav a hned zpatky. 45 s znamena,
# ze takovy alt-tab nestoji ani jedno binderove volani a hlavne se
# neprepina refresh rate tam a zpet.
APP_STICKY_SEC="45"


# =============================================================================
# TEPLOTA A PRIORITA
# =============================================================================
#
# 1 = smi ignorovat teplotni uroven 1.
#
# POZOR, TOHLE JE PROTI PUVODNI SABLONE ZMENA V UVAZE:
# Puvodni sablona rikala "bez toho by sis v PoGO uvaril telefon", protoze
# hra bezi na slunci a vsechno nad 40,5 C je vnejsi teplo, se kterym
# zatez nic nezmuze. To plati - ale jen dokud je uroven 1 nastavena NAD
# prah, pri kterem zabira HAL.
#
# Doporucena zmena prahu v demonu (viz RESEARCH-2026-08.md cast C):
#     uroven 1 = 40,0 C  (tesne pod prah CPU-MID 41,0)
#     uroven 2 = 43,0 C  (prah CPU-HIGH)
#     hystereze 1,9 C    (stejna, jakou pouziva HAL)
#
# S temihle prahy je APP_THERMAL_CAP=1 spravne: uroven 1 je preventivni
# a hra ji smi ignorovat, protoze uz sama bezi na omezenem profilu.
# Uroven 2 ignorovat NESMI a to je natvrdo v kodu.
APP_THERMAL_CAP="1"

# 90 = vysoka priorita. Notifikace ani rychla odpoved ve zpravach nesundaji
# nastaveni behem hry.
APP_PRIORITY="90"


# =============================================================================
# CO TOHLE PRAVIDLO NEUMI A MUSIS UDELAT RUCNE V HRE
# =============================================================================
#
#   Settings -> Advanced Settings -> Native Refresh Rate:  ZAPNOUT
#       Bez toho hra bezi na 30 fps, ne 60. Tvoje zadani je 60.
#
#   AR / AR+:  VYPNOUT
#       Zapina kameru a ISP. Krome tepla to navic nastavi
#       vendor.thermal.*.profile na "camera", coz rozhodi cely modul -
#       demon pak prepnuti profilu odklada (a po 600 s to zacne ignorovat).
#
#   Battery Saver (v aplikaci):  ZAPNOUT
#   Vibrace:  VYPNOUT
#   Hudba a zvukove efekty:  VYPNOUT, kdyz je nepotrebujes
#   Download All Assets:  jednou pres Wi-Fi
#
# A vec, ktera je ucinnejsi nez cely tenhle soubor dohromady:
#   pri delsi hre SUNDAT POUZDRO. Skrti se podle teploty povrchu.
