# =============================================================================
# pixel_tune - rule for Pokemon GO
# Pixel 8a / Tensor G3 "zuma" / Android 16
#
# BRIEF: lowest possible graphics, limited CPU, but KEEP 60 Hz and 60 fps.
#
# THE REASONING EVERYTHING FOLLOWS FROM
# -------------------------------------
# PoGO is not a demanding game. It is a LONG game that runs for hours, often
# outdoors, often in direct sunlight. From Google's
# thermal_info_config_akita.json we know that this phone throttles EXCLUSIVELY
# by SURFACE temperature (VIRTUAL-SKIN), not by silicon temperature:
#     VIRTUAL-SKIN-CPU-MID   thresholds 39.0 and 41.0 C
#     VIRTUAL-SKIN-CPU-HIGH  thresholds 41.0, 43.0 and 52.0 C
#     hysteresis 1.9 C, MaxReleaseStep 1 (recovery ~84 s)
#
# The measured self-heating ceiling under full load on all nine cores is
# 40.5 C skin. In other words: playing in the sun you will cross the 41 C
# threshold even WITHOUT any load. The goal of this rule is therefore NOT to
# extract performance but to cut performance back to the level the game still
# needs, and thereby postpone the moment the skin reaches 41 C.
#
# WHY THIS RULE DOES NOT USE THE `game` PROFILE
# ---------------------------------------------
# The `game` profile sets vendor.thermal.VIRTUAL-SKIN-CPU-{MID,HIGH}.profile
# to "game", which per Google's config gives all three CPU cooling devices
# "Disabled": true - i.e. it DISABLES throttling from those two sensors.
# That is right for a short demanding session where you want to exploit
# thermal inertia. For a two-hour outdoor session it is exactly the opposite:
# you want the HAL to throttle SOONER and MORE GENTLY, not later and harder.
# That is why PoGO has its own `pogo` profile, not `game`.
# =============================================================================

APP_PKG="com.nianticlabs.pokemongo"
APP_DESC="Pokemon GO - long outdoor sessions, surface temperature first"
APP_ENABLED="1"


# =============================================================================
# LAYER 1 - Android Game Mode
# =============================================================================
#
# MIND THE SYNTAX: `cmd game downscale` is deprecated. The correct form is
#   cmd game set --downscale 0.7 --fps 60 com.nianticlabs.pokemongo
#   cmd game mode 4 com.nianticlabs.pokemongo
# The allowed downscale values are finer than example.conf.template states:
#   0.5 0.55 0.6 0.65 0.7 0.75 0.8 0.85 0.9 disable
# CAUTION: the module rejects values below 0.5. With aggressive downscaling
# (0.3/0.4) the Android GameManager breaks touch mapping and smoothness in
# Unity games (PoGO) - input gets stuck and the game reads it wrong. 0.7 is
# verified safe.
#
# IF MODE 4 HAS NO EFFECT, the GameManager does not consider PoGO a game.
# A fallback that does not depend on the app category (one-off, manual, not
# from the module):
#   device_config put game_overlay com.nianticlabs.pokemongo \
#       'mode=2,downscaleFactor=0.7,fps=60:mode=3,downscaleFactor=0.5,fps=30'
#   cmd game mode 2 com.nianticlabs.pokemongo
# The game must be RESTARTED after every mode change.

GAME_MODE="4"

# 60 is a cap, not a target. The game itself offers 60 at most, and only when
# Native Refresh Rate is enabled in its settings. Without that it runs at 30.
GAME_FPS="60"

# 0.7 = 70 % of native resolution, i.e. roughly half the work for the GPU.
# On the PoGO map you cannot tell; finer steps are available should it bother
# you on text. Do not go below 0.5, dialogs start falling apart there.
# This is the safe route to "lowering the resolution": it is per-app, it is
# done by SurfaceFlinger and nothing has to be restored.
GAME_DOWNSCALE="0.7"

GAME_APPLY="once"


# =============================================================================
# LAYER 2 - profile and per-key overrides
# =============================================================================

# A dedicated profile, not `game`. See the reasoning in the header.
APP_PROFILE="pogo"

# --- limiting the CPU while keeping 60 fps ----------------------------------
#
# Calibration against the measured cpu_capacity values (Little 182 / Big 725 /
# Prime 1024):
#
#   50 => util 512 => ~1672 MHz on Big, and 50 < 70.8 => Prime will NEVER
#   wake up for the game. Prime is the largest individual heat source and PoGO
#   does not need it - it is a Unity game with a simple scene, not a
#   benchmark. 1672 MHz is still almost twice the steady state (910 MHz), so
#   it will not show up as stuttering.
APP_OVERLAY_UCLAMP_TOPAPP_MAX="50"

#   30 => util 307 => a floor of ~1002 MHz on Big. Between frames the render
#   thread does not fall to a low OPP, so the next frame does not start from
#   zero. That is what keeps frame-time stable at 60 fps.
#   A floor of 30 is below the 38 % steady state, so it does not fight the HAL.
APP_OVERLAY_UCLAMP_TOPAPP_MIN="30"

#   The background is deliberately NOT SET. Per powerhint-akita.json,
#   /proc/vendor_sched/groups/bg/uclamp_max is stock 130 out of 1024, i.e.
#   12.7 %, which is already below the Little threshold (17.8 %). Anything I
#   wrote into /dev/cpuctl/background would be looser and therefore without
#   effect.
#APP_OVERLAY_UCLAMP_BG_MAX=""

# --- GPU --------------------------------------------------------------------
#
# 723000 is the third step from the top (890/850/807/723), i.e. ~81 % of the
# stock maximum. Together with downscale 0.7 that means the GPU has to do
# roughly half the work at a fifth lower frequency - and it still holds 60 fps
# on a PoGO scene.
# This is not guesswork: during your CPU-only load test cdev_gpu sat at zero
# for all 150 s, so the GPU has plenty of headroom on this phone.
APP_OVERLAY_GPU_MAX_FREQ="723000"

# A 20 ms GPU frequency re-evaluation period instead of 10. At a stable 60 fps
# there is nothing to recompute faster; this saves the overhead.
# (Node /sys/devices/platform/1f000000.mali/dvfs_period - verify with the probe.)
APP_OVERLAY_GPU_DVFS_PERIOD="20"

# --- thermal ----------------------------------------------------------------
#
# EMPTY, AND THAT IS INTENTIONAL. See the header: during a two-hour outdoor
# session you do not want to disable the skin sensors.
APP_OVERLAY_THERMAL_PROFILE_CPU_MID=""
APP_OVERLAY_THERMAL_PROFILE_CPU_HIGH=""

# --- clock cap --------------------------------------------------------------
#
# ONLY ONCE pxtune-probe confirms that sched_pixel/limit_frequency is
# writable. Leave empty until then - the values come from Google's powerhint,
# but writability on Android 16 has not been verified.
# 1557000 is a valid Prime OPP and lies between 1298000 and 1745000, which the
# power HAL uses itself.
#APP_OVERLAY_SCHED_LIMIT_FREQ_BIG="1557000"
#APP_OVERLAY_SCHED_LIMIT_FREQ_MID="1418000"


# =============================================================================
# LAYER 3 - refresh rate
# =============================================================================
#
# 60/60 = a fixed 60 Hz for the duration of the game. Exactly per the brief.
#
# This is the single item with the LARGEST effect on battery life in the whole
# file: a 120 Hz panel costs energy that PoGO cannot make any use of - the
# game never draws more than 60 frames anyway. It also reduces SurfaceFlinger's
# work, and therefore the heat.
#
# The write is GLOBAL; per-app only works by setting it on entry and restoring
# it on exit. The restore is handled by `pxtune app leave`, which is called
# from six independent paths - see bin/pxtune-perapp.
APP_REFRESH_MIN="60"
APP_REFRESH_PEAK="60"

# Resolution changes are FORBIDDEN. GAME_DOWNSCALE above does almost the same
# thing, is genuinely per-app and nothing has to be restored.
APP_RES=""
APP_RES_ENABLE="0"


# =============================================================================
# ANTI-FLAPPING
# =============================================================================
#
# PoGO gets opened for a long stretch, not for a quick glance. A longer entry
# delay costs nothing and reliably filters out the splash screen.
APP_MIN_FG_SEC="10"

# Lazy exit is especially valuable here: while playing you constantly switch
# to maps, the camera or messages and straight back. 45 s means such an
# alt-tab costs not a single binder call, and above all the refresh rate is
# not switched back and forth.
APP_STICKY_SEC="45"


# =============================================================================
# TEMPERATURE AND PRIORITY
# =============================================================================
#
# 1 = may ignore thermal level 1.
#
# CAUTION, THIS IS A CHANGE IN REASONING FROM THE ORIGINAL TEMPLATE:
# The original template said "without it you would cook the phone in PoGO",
# because the game runs in the sun and everything above 40.5 C is external
# heat that the load cannot do anything about. That holds - but only as long
# as level 1 is set ABOVE the threshold at which the HAL kicks in.
#
# The recommended threshold change in the daemon (see RESEARCH-2026-08.md
# part C):
#     level 1 = 40.0 C  (just below the CPU-MID threshold of 41.0)
#     level 2 = 43.0 C  (the CPU-HIGH threshold)
#     hysteresis 1.9 C  (the same one the HAL uses)
#
# With those thresholds APP_THERMAL_CAP=1 is right: level 1 is preventive and
# the game may ignore it, because it is already running on a restricted
# profile. It must NOT ignore level 2, and that is hard-coded.
APP_THERMAL_CAP="1"

# 90 = high priority. Neither a notification nor a quick reply in messages
# will take the settings down mid-game.
APP_PRIORITY="90"


# =============================================================================
# WHAT THIS RULE CANNOT DO AND YOU MUST SET MANUALLY IN THE GAME
# =============================================================================
#
#   Settings -> Advanced Settings -> Native Refresh Rate:  ON
#       Without it the game runs at 30 fps, not 60. Your brief says 60.
#
#   AR / AR+:  OFF
#       Turns on the camera and the ISP. Besides the heat, it also sets
#       vendor.thermal.*.profile to "camera", which throws the whole module
#       off - the daemon then postpones profile switches (and after 600 s
#       starts ignoring it).
#
#   Battery Saver (in the app):  ON
#   Vibration:  OFF
#   Music and sound effects:  OFF when you do not need them
#   Download All Assets:  once, over Wi-Fi
#
# And the one thing more effective than this whole file put together:
#   TAKE THE CASE OFF for a longer session. Throttling goes by surface
#   temperature.
