# =============================================================================
# pixel_tune — rule for Instagram
# Pixel 8a / Tensor G3 "zuma" / Android 16
#
# FOCUSED ON REELS. Instagram is the worst possible load profile for this
# phone: a long session, continuous video decoding, full brightness and
# scrolling.
#
# WHAT HAPPENS DURING REELS (and what of it can be influenced)
# ------------------------------------------------------------
# 1) Video decoding. Runs on the HW decoder, not the CPU — out of this
#    module's reach, and rightly so; software decoding would be far worse.
# 2) Panel and brightness. The largest single item. Out of the module's reach.
# 3) SurfaceFlinger + Instagram's render thread. At 120 Hz the budget is
#    8.3 ms per frame, i.e. twice the work per second compared to 60 Hz — and
#    the video itself is 30 fps. THIS IS THE ONE BIG ITEM THE MODULE CONTROLS.
# 4) Prefetching further reels in the background. Handled in the app's
#    settings, not here.
#
# The Pixel 8a panel is NOT LTPO — it can only do 60 or 120 Hz, nothing in
# between. There is therefore no "lock it to 48 Hz for video" the way LTPO
# phones can.
# =============================================================================

APP_PKG="com.instagram.android"
APP_DESC="Instagram — long Reels sessions, power draw and temperature first"
APP_ENABLED="1"

# Game Mode is NOT USED. The GameManager only takes apps in the game category;
# Instagram is not one, so `cmd game set` would fail silently.
GAME_MODE=""
GAME_FPS=""
GAME_DOWNSCALE=""
GAME_APPLY=""


# =============================================================================
# PROFILE AND OVERRIDES
# =============================================================================

# `powersave` is the right choice for Reels: a long steady load where there is
# nothing to gain from the peak. If you want the profile left unchanged, set
# "" and keep only the overrides below.
APP_PROFILE="powersave"

# --- CPU ---------------------------------------------------------------------
#
# 55 => util 563 => ~1839 MHz on Big. Below the 70.8 threshold => Prime (X3)
# will NEVER wake up for Instagram. Prime is the largest individual heat
# source and scrolling a list of videos does not need it.
#
# Why not lower: Instagram is notoriously heavy on the render thread and at
# 120 Hz you have no margin. Below 50 it would start showing as stutter while
# swiping.
APP_OVERLAY_UCLAMP_TOPAPP_MAX="55"

# The floor is DELIBERATELY NOT SET. Reels is a steady load, not a series of
# launches — a floor would be paid for the whole hour and used in the first
# 300 ms, which the power HAL's LAUNCH hint already covers.
APP_OVERLAY_UCLAMP_TOPAPP_MIN=""

# --- GPU ---------------------------------------------------------------------
#
# Video composition + UI. 649000 = 73 % of the maximum; at 60 Hz (see below)
# even less would do, at 120 Hz this is a sensible floor.
APP_OVERLAY_GPU_MAX_FREQ="649000"
APP_OVERLAY_GPU_DVFS_PERIOD="20"

# --- thermal -----------------------------------------------------------------
# Empty. An hour of scrolling is exactly the case where you WANT the HAL to
# throttle sooner and more gently — not to have the skin sensors disabled.
APP_OVERLAY_THERMAL_PROFILE_CPU_MID=""
APP_OVERLAY_THERMAL_PROFILE_CPU_HIGH=""


# =============================================================================
# REFRESH RATE — THIS IS THE DECISION POINT, THINK IT OVER
# =============================================================================
#
# OPTION A (DEFAULT, ACTIVE): we keep 120 Hz.
# Respects your "I want my 120 Hz" requirement. Instagram stays smooth when
# swiping between reels. The saving then comes only from the CPU and GPU caps
# above, which is a few percent at best.
#
# Empty = the rule does not touch the refresh rate.
APP_REFRESH_MIN=""
APP_REFRESH_PEAK=""

# OPTION B (UNCOMMENT IF YOU WANT A STEP CHANGE IN BATTERY LIFE):
# Locks Instagram to 60 Hz while it is in the foreground and restores it on
# exit.
#
# This is BY FAR the biggest single lever in the whole file. Reels is video at
# 30 frames per second — at 120 Hz you gain nothing from it except a smoother
# swipe between clips. What you pay is twice the SurfaceFlinger and render
# thread work for the entire session.
#
# The cost: swiping between reels will be visibly less smooth. Nothing else.
# I would try it for at least a week and compare power draw per hour.
#APP_REFRESH_MIN="60"
#APP_REFRESH_PEAK="60"

# Resolution changes forbidden — a global write with a risk of an
# unrecoverable state.
APP_RES=""
APP_RES_ENABLE="0"


# =============================================================================
# ANTI-FLAPPING
# =============================================================================
# Instagram gets opened for a long stretch, not for a quick glance. 8 s filters
# out the case where you jump in from a notification and straight back out.
APP_MIN_FG_SEC="8"

# 30 s of lazy exit: during Reels you often nip over to messages or a link in
# the browser and straight back. Without it the settings (and above all the
# refresh rate, if you enabled option B) would switch back and forth.
APP_STICKY_SEC="30"


# =============================================================================
# TEMPERATURE AND PRIORITY
# =============================================================================
# 0 = thermal levels are respected without exception.
#
# Unlike PoGO, there is NO reason to ignore level 1 here. You scroll Instagram
# in your hand, not in the sun — when the phone reaches 40 °C on the surface,
# that is YOUR load, not the surroundings, and easing off makes sense.
APP_THERMAL_CAP="0"

# 50 = medium priority. It should not outbid PoGO or games.
APP_PRIORITY="50"


# =============================================================================
# WHAT YOU MUST DO OUTSIDE THIS FILE (and there is more of it than in here)
# =============================================================================
#
# 1) CHECK THE APP VERSION. Instagram had a confirmed bug that drained Android
#    phones even when unused. Both Google and Meta acknowledged it and the fix
#    is in build 382.0.0.49.84 and newer. If you are on an older one, no tweak
#    will fix it:
#    adb shell dumpsys package com.instagram.android | grep versionName
#
# 2) IN THE APP:
#    - Settings -> Data usage and media quality -> "Use less mobile data"
#      Limits background prefetching of reels. That is the part of the power
#      draw that runs even when you are not looking at the phone.
#    - Turn off "Upload at highest quality"
#
# 3) IN ANDROID:
#    - Settings -> Apps -> Instagram -> Mobile data and Wi-Fi
#      -> turn off background data
#      CAUTION: message notifications will stop arriving until you open the
#      app. With Instagram that rarely bothers anyone — with Signal it would
#      be a disaster, so do not mix the apps up.
#    - Settings -> Apps -> Instagram -> Battery -> Restricted
#
# 4) BRIGHTNESS. Over an hour of Reels the display is a bigger item than
#    everything above put together. Automatic brightness instead of manual
#    maximum will do more than this whole file.
