# =============================================================================
# pixel_tune — pravidlo pro Instagram
# Pixel 8a / Tensor G3 „zuma" / Android 16
#
# ZAMĚŘENO NA REELS. Instagram je pro tenhle telefon nejhorší možný profil
# zátěže: dlouhá relace, nepřetržité dekódování videa, plný jas a scrollování.
#
# CO SE PŘI REELS DĚJE (a co z toho jde ovlivnit)
# -----------------------------------------------
# 1) Dekódování videa. Běží na HW dekodéru, ne na CPU — na tenhle modul
#    nedosáhne a je to tak dobře, softwarové dekódování by bylo mnohem horší.
# 2) Panel a jas. Největší jednotlivá položka. Modul na to nedosáhne.
# 3) SurfaceFlinger + render vlákno Instagramu. Při 120 Hz je rozpočet 8,3 ms
#    na snímek, tedy dvojnásobek práce za sekundu proti 60 Hz — a video samo
#    má 30 fps. TOHLE JE JEDINÁ VELKÁ POLOŽKA, KTEROU MODUL OVLÁDÁ.
# 4) Prefetch dalších reels na pozadí. Řeší se nastavením v aplikaci, ne tady.
#
# Panel Pixelu 8a NENÍ LTPO — umí jen 60 nebo 120 Hz, nic mezi. Neexistuje
# tedy „zamkni to na 48 Hz kvůli videu", jak to umí LTPO telefony.
# =============================================================================

APP_PKG="com.instagram.android"
APP_DESC="Instagram — dlouhé Reels relace, priorita spotřeby a teploty"
APP_ENABLED="1"

# Game Mode se NEPOUŽÍVÁ. GameManager bere jen aplikace v kategorii hra;
# Instagram tam není, takže `cmd game set` by tiše selhal.
GAME_MODE=""
GAME_FPS=""
GAME_DOWNSCALE=""
GAME_APPLY=""


# =============================================================================
# PROFIL A PŘEBITÍ
# =============================================================================

# `powersave` je pro Reels správná volba: dlouhá ustálená zátěž, kde není co
# vytěžit ze špičky. Kdybys chtěl profil beze změny, nastav "" a nech jen
# přebití níž.
APP_PROFILE="powersave"

# --- CPU ---------------------------------------------------------------------
#
# 55 => util 563 => ~1839 MHz na Big. Pod prahem 70,8 => Prime (X3) se kvůli
# Instagramu NIKDY neprobudí. Prime je největší jednotlivý zdroj tepla a
# scrollování v seznamu videí ho nepotřebuje.
#
# Proč ne níž: Instagram je notoricky těžký na render vlákno a při 120 Hz
# nemáš rezervu. Pod 50 by se to začalo projevovat trháním při swipu.
APP_OVERLAY_UCLAMP_TOPAPP_MAX="55"

# Podlaha ZÁMĚRNĚ NENASTAVENA. Reels je ustálená zátěž, ne série startů —
# podlaha by se platila celou hodinu a využila by se v prvních 300 ms, které
# už pokrývá LAUNCH hint od power HALu.
APP_OVERLAY_UCLAMP_TOPAPP_MIN=""

# --- GPU ---------------------------------------------------------------------
#
# Kompozice videa + UI. 649000 = 73 % maxima; při 60 Hz (viz níž) by stačilo
# i míň, při 120 Hz je tohle rozumné dno.
APP_OVERLAY_GPU_MAX_FREQ="649000"
APP_OVERLAY_GPU_DVFS_PERIOD="20"

# --- thermal -----------------------------------------------------------------
# Prázdné. Hodinové scrollování je přesně ten případ, kdy CHCEŠ, aby HAL
# škrtil dřív a jemněji — ne aby se vypnuly skin senzory.
APP_OVERLAY_THERMAL_PROFILE_CPU_MID=""
APP_OVERLAY_THERMAL_PROFILE_CPU_HIGH=""


# =============================================================================
# REFRESH RATE — TADY SE ROZHODUJE, ROZMYSLI SI TO
# =============================================================================
#
# VARIANTA A (VÝCHOZÍ, AKTIVNÍ): necháváme 120 Hz.
# Respektuje tvůj požadavek „chci svých 120 Hz". Instagram zůstane plynulý
# při swipování mezi reels. Úspora přijde jen z CPU a GPU stropů výše, což
# je odhadem jednotky procent.
#
# Prázdné = pravidlo na refresh rate nesahá.
APP_REFRESH_MIN=""
APP_REFRESH_PEAK=""

# VARIANTA B (ODKOMENTUJ, JESTLI CHCEŠ SKOKOVOU ÚSPORU):
# Zamkne Instagram na 60 Hz po dobu, co je v popředí, a při odchodu vrátí zpět.
#
# Tohle je ZDALEKA největší jednotlivá páka celého souboru. Reels je video
# o 30 snímcích za sekundu — na 120 Hz z toho nic nezískáš kromě plynulejšího
# swipu mezi klipy. Zaplatíš ale dvojnásobek práce SurfaceFlingeru a render
# vlákna po celou dobu relace.
#
# Cena: swipe mezi reels bude viditelně méně plynulý. Nic jiného.
# Doporučuju to alespoň týden zkusit a porovnat spotřebu za hodinu.
#APP_REFRESH_MIN="60"
#APP_REFRESH_PEAK="60"

# Změna rozlišení zakázána — globální zápis, riziko nevratného stavu.
APP_RES=""
APP_RES_ENABLE="0"


# =============================================================================
# ANTI-FLAPPING
# =============================================================================
# Instagram se otevírá na dlouho, ne na proletnutí. 8 s odfiltruje případy,
# kdy do něj skočíš z notifikace a hned zpátky.
APP_MIN_FG_SEC="8"

# 30 s líné lenosti při odchodu: při Reels často odskočíš do zpráv nebo na
# odkaz v prohlížeči a hned zpátky. Bez toho by se nastavení (a hlavně
# refresh rate, kdybys zapnul variantu B) přepínalo tam a zpět.
APP_STICKY_SEC="30"


# =============================================================================
# TEPLOTA A PRIORITA
# =============================================================================
# 0 = teplotní úrovně se respektují bez výjimky.
#
# Na rozdíl od PoGO tady NENÍ důvod ignorovat úroveň 1. Instagram scrolluješ
# v ruce, ne na slunci — když se telefon dostane na 40 °C povrchu, je to
# TVOJE zátěž, ne okolí, a má smysl ubrat.
APP_THERMAL_CAP="0"

# 50 = střední priorita. Nemá přebíjet PoGO ani hry.
APP_PRIORITY="50"


# =============================================================================
# CO MUSÍŠ UDĚLAT MIMO TENHLE SOUBOR (a je toho víc než tady)
# =============================================================================
#
# 1) OVĚŘ VERZI APLIKACE. Instagram měl potvrzenou chybu, kvůli které vybíjel
#    Android telefony i bez použití. Google i Meta ji uznali a oprava je
#    v buildu 382.0.0.49.84 a novějším. Když máš starší, žádný tweak to
#    nespraví:  adb shell dumpsys package com.instagram.android | grep versionName
#
# 2) V APLIKACI:
#    - Nastavení -> Využití dat a kvalita médií -> „Šetřit data"
#      Omezí prefetch reels na pozadí. To je ta část spotřeby, která běží,
#      i když se na telefon nedíváš.
#    - Vypni „Nahrávat v nejvyšší kvalitě"
#
# 3) V ANDROIDU:
#    - Nastavení -> Aplikace -> Instagram -> Mobilní data a Wi-Fi
#      -> vypnout data na pozadí
#      POZOR: tím přestanou chodit notifikace o zprávách, dokud aplikaci
#      neotevřeš. U Instagramu to většinou nikomu nevadí — u Signalu by to
#      byla katastrofa, tak si nesplet aplikaci.
#    - Nastavení -> Aplikace -> Instagram -> Baterie -> Omezeno
#
# 4) JAS. Při hodině Reels je displej větší položka než všechno výše dohromady.
#    Automatický jas místo ručního maxima udělá víc než celý tenhle soubor.
